  narration:
    needs: prepare
    if: github.ref == 'refs/heads/board-video-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blackboard-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Mandarin narrator
        run: |
          sudo apt-get update -q
          sudo apt-get install -y espeak-ng
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
          pip install 'kokoro==0.9.4' 'misaki[zh]==0.9.4' soundfile
      - name: Retrieve and verify the voice model
        env:
          MODEL_REPO: https://huggingface.co/hexgrad/Kokoro-82M-v1.1-zh/resolve/main
        run: |
          mkdir -p model/voices
          for file in config.json voices/zf_001.pt kokoro-v1_1-zh.pth; do
            curl -fSL --retry 3 "$MODEL_REPO/$file" -o "model/$file"
          done
          echo "b1d8410fa44dfb5c15471fd6c4225ea6b4e9ac7fa03c98e8bea47a9928476e2b  model/kokoro-v1_1-zh.pth" | sha256sum --check
      - name: Record the explanations and opening sample questions
        run: python scripts/board-narration.py --model-dir model
      - uses: actions/upload-artifact@v4
        with:
          name: blackboard-narration
          path: board-voice
          retention-days: 2
  render:
    needs: narration
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        start: [0, 5, 10, 15, 20, 25, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blackboard-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: blackboard-narration
          path: board-voice
      - name: Install the video encoder and Chinese font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install pillow
      - name: Render groups of continuous playback
        env:
          START_GROUP: ${{ matrix.start }}
        run: python scripts/build-board-video.py --from-group "$START_GROUP" --to-group "$((START_GROUP+4))"
      - uses: actions/upload-artifact@v4
        with:
          name: blackboard-video-${{ matrix.start }}
          path: board/media
          compression-level: 0
          retention-days: 2
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blackboard-source
      - uses: actions/download-artifact@v4
        with:
          pattern: blackboard-video-*
          path: board/media
          merge-multiple: true
      - name: Verify every question and add the entry to the listening page
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          python scripts/check-board-video.py
          python scripts/install-board-entry.py
      - name: Save the verified build on the staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board scripts index.html
          git commit -m 'Build blackboard clips for all 1,307 questions'
          git push origin HEAD:board-video-build
