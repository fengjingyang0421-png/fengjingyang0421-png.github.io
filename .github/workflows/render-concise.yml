name: Build concise Mandarin listening
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: concise-mandarin
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare application and narration scripts
        run: |
          mkdir -p voice-build
          cat > voice-build/prepare.py <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if sha256(s.rstrip('\n').encode()).hexdigest() != 'cd4dd895255894e4b4e1c3e25f5b97b026a370242cb6803487b56dca7b033f0f' and 'const recordedThrough = 1307;' not in s:
              raise SystemExit('The original website has changed. Rebase the natural voice update before rendering.')
          bank=re.search(r'<script id="embedded-bank" type="application/json">(.*?)</script>',s,re.S).group(1)
          p.write_text('<!doctype html>\n<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">\n<meta property="og:title" content="低压电工刷题">\n<meta property="og:description" content="低压电工证考试在线刷题，手机电脑都能用">\n<title>低压电工刷题</title><meta name="theme-color" content="#f3f6fc">\n<style>\n:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#172033;background:#f3f6fc;--blue:#383fd2;--stroke:#d9dfec;--muted:#515f75;--paper:#fff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #747bea;outline-offset:2px}header{background:var(--paper);border-bottom:1px solid var(--stroke)}.top,main,footer{max-width:1220px;margin:auto;padding:0 28px}.top{min-height:69px;display:flex;align-items:center;gap:27px}.brand{font-weight:800;white-space:nowrap;font-size:21px;display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;border-radius:9px;width:35px;height:35px;background:var(--blue);color:white;font-size:23px}nav{display:flex;gap:19px;align-self:stretch}nav button{padding:0 6px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:#3e4960;white-space:nowrap}nav button.active{color:var(--blue);border-color:var(--blue)}.local{margin-left:auto;font-size:13px;min-width:145px}.local b{float:right}.bar{height:8px;border-radius:8px;background:#e3e7f1;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:var(--blue);border-radius:inherit}main{padding-top:39px;padding-bottom:36px;min-height:74vh}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(265px,1fr);gap:24px;align-items:start}.section-head{margin:0 0 22px}.section-head h1{font-size:34px;margin:0 0 8px;line-height:1.24}.section-head p,.muted{color:var(--muted);margin:0;line-height:1.65}.card{background:var(--paper);border:1px solid var(--stroke);border-radius:14px;padding:23px;margin-bottom:18px}.q-head,.row,.controls,.stat-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.q-head{border-bottom:1px solid var(--stroke);padding-bottom:15px;font-size:16px}.q-head strong{font-size:20px}.stem{font-size:24px;line-height:1.55;margin:23px 0;white-space:pre-line}.option{display:flex;text-align:left;align-items:center;gap:13px;background:#fff;border:1px solid var(--stroke);border-radius:9px;width:100%;padding:13px 14px;margin:9px 0;min-height:52px;color:inherit;line-height:1.45}.key{width:28px;height:28px;display:grid;place-items:center;border:1px solid #aeb9ce;border-radius:6px;flex:none;font-weight:750}.option:hover:not([disabled]),.option.selected{border-color:var(--blue);background:#eef0ff}.option.good{border-color:#73b89b;background:#e9f8ef}.option.bad{border-color:#d88581;background:#fff0ef}.option:disabled{opacity:1}.controls{border-top:1px solid var(--stroke);padding-top:16px;margin-top:21px;flex-wrap:wrap}.btn{padding:9px 13px;border:1px solid #b7c2d8;border-radius:8px;background:#fff;color:#293650;font-weight:700}.btn:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover:not([disabled]){background:#3036b8;color:#fff}.ghost{color:var(--blue);border-color:#a8aaf2}.aside-title{margin:0 0 16px;font-size:23px}.stat-line{margin-bottom:6px}.metric+.metric{margin-top:18px}.minor,.horizon{border-top:1px solid var(--stroke);margin-top:18px;padding-top:14px;font-size:14px}.horizon div{padding:7px 0}.eyed{color:#187b52}.warn{color:#965811}.feedback{padding:15px 17px;border-radius:9px;background:#f0f2ff;margin-top:17px;line-height:1.65;white-space:pre-line}.feedback p{margin:7px 0 0}.feedback.wrong{background:#fff2eb}.notice{padding:12px 15px;background:#fff4df;border-radius:8px;color:#714917;line-height:1.55}.option-img{display:block;max-width:100%;height:auto;margin:3px 0}.qimage{display:block;max-width:100%;max-height:400px;margin:0 auto 20px;border:1px solid var(--stroke);border-radius:6px}footer{border-top:1px solid var(--stroke);padding-top:16px;padding-bottom:20px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}kbd{border:1px solid #b9c4d7;border-radius:4px;padding:1px 4px;background:white;color:#28354c}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:16px 0}.fields label{display:block;font-weight:700}.fields input:not([type=checkbox]),.fields select,.search input{width:100%;margin-top:7px;border:1px solid #aeb9ce;border-radius:8px;padding:8px 10px;background:white;color:inherit}.fields .check{display:flex;align-items:center;gap:8px;margin:10px 0}.list{display:grid;gap:7px;margin:17px 0}.list button{text-align:left;display:flex;gap:9px;align-items:baseline}.list button span{color:var(--muted);min-width:44px}.search{display:flex;gap:10px;align-items:end}.search label{flex:1}.now{font-variant-numeric:tabular-nums;font-weight:700}.small{font-size:13px}.empty h2{margin-top:0}.msg{color:var(--blue);margin-top:10px}.timeline{display:grid;gap:3px}.timeline .row:first-child{color:#187b52}.audio-state{font-size:12px}.foot-buttons{display:flex;gap:7px;flex-wrap:wrap}.skip{margin-right:auto}.offscreen{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(100%)}@media(max-width:870px){.top,main,footer{padding-left:17px;padding-right:17px}.top{gap:13px}.local{display:none}nav{gap:11px}.grid{grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr)}}@media(max-width:650px){.top{display:block;padding-top:11px}.brand{font-size:18px}.logo{width:29px;height:29px}.top nav{margin-top:8px;min-height:39px;justify-content:space-between;gap:0}.top nav button{font-size:14px;padding:0 3px}main{padding-top:24px}.grid{display:block}.section-head h1{font-size:29px}.section-head{margin-bottom:15px}.card{padding:16px}.stem{font-size:21px}.q-head strong{font-size:17px}.aside-title{margin-top:22px}.local{display:none}.controls{justify-content:flex-end}.controls small{margin-right:auto}.fields{gap:10px}} \n.retry-note{margin:12px 0 0;color:#715223;font-size:14px}.feedback .btn{margin-top:9px}.controls button{min-height:44px}.audio-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.voice-label{grid-column:1/-1}.audio-state:not(:empty){display:block;margin-top:8px}.option-img{object-fit:contain}.study-clock{font-variant-numeric:tabular-nums}\n@media(max-width:650px){nav button{min-height:44px}.option{min-height:55px}.btn,.fields select,.fields input:not([type=checkbox]),.search input{min-height:44px}.fields input:not([type=checkbox]),.fields select,.search input{font-size:16px}.q-head{align-items:flex-start}.q-head strong{padding-top:10px}.q-head .btn{font-size:13px}.controls .foot-buttons .primary{min-width:126px}.desktop-keys{display:none}footer{padding-bottom:max(20px,env(safe-area-inset-bottom))}}\n.share-top{font-size:13px;margin-left:8px}dialog{max-width:520px;width:calc(100% - 32px);border:1px solid var(--stroke);border-radius:16px;padding:24px;color:inherit}dialog::backdrop{background:#17203380}dialog h2{margin:0 0 12px}dialog p{line-height:1.7}dialog input{width:100%;padding:12px;border:1px solid var(--stroke);border-radius:8px;font-size:16px}.share-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.share-actions button{min-height:44px}.share-help{font-size:14px;color:var(--muted)}.brand .share-top{margin-left:auto}.brand{gap:8px}.empty .btn{margin-top:12px}\n.listen-controls{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.listen-controls .btn{min-height:46px}.listen-options{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:18px 0}.listen-options select{font:inherit;padding:8px;border:1px solid var(--stroke);border-radius:8px;background:white}.listen-options input{width:18px;height:18px;vertical-align:middle}.listen-status{color:var(--blue);font-weight:700}.listen-option{padding:11px 12px;margin:8px 0;border:1px solid var(--stroke);border-radius:9px;line-height:1.6}.listen-option b{margin-right:10px}.listen-layout{max-width:900px}.listen-answer{background:#e9f8ef;padding:14px;border-radius:9px;line-height:1.7}.listen-explanation{line-height:1.8;white-space:pre-line}.listen-jump{display:flex;gap:10px;align-items:end;max-width:420px}.listen-jump input{width:100%;min-width:0;border:1px solid var(--stroke);border-radius:8px;padding:10px;font-size:16px}.listen-jump label{flex:1;min-width:0}.listen-jump .btn{white-space:nowrap;min-height:44px}.listen-options select{min-height:44px}\n@media(max-width:650px){.listen-controls .primary{flex:1;min-width:120px}.listen-controls{gap:7px}.listen-controls .btn{padding:10px}.listen-options{gap:12px}.top nav button{font-size:13px}}\n.player-controls{position:sticky;top:8px;z-index:2;background:white;padding:8px 0;border-radius:9px}.listen-layout .card:first-child{overflow:visible}\n</style>\n<header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">ϟ</span>低压电工刷题<button class="btn share-top" data-act="share">分享</button></div><nav aria-label="页面"><button data-tab="daily">今日练习</button><button data-tab="wrong">错题复习</button><button data-tab="listen">听题模式</button><button data-tab="bank">题库</button><button data-tab="settings">设置</button></nav><div class="local" id="local"></div></div></header>\n<main id="app"></main><footer><span>低压电工作业 · 学习进度保存在当前浏览器 · 自然普通话版</span><span class="desktop-keys"><kbd>1–9</kbd> 选项\u3000<kbd>Enter</kbd> 提交或下一题\u3000<kbd>R</kbd> 朗读</span></footer>\n<div role="status" id="live" class="offscreen"></div>\n<dialog id="share-dialog" aria-labelledby="share-title"><h2 id="share-title">把刷题链接分享给朋友</h2><p>无需注册或登录。每个人的错题、复习计划和设置都保存在自己的浏览器里。</p><label for="share-link">刷题链接</label><input id="share-link" readonly value="https://fengjingyang0421-png.github.io/" aria-label="刷题链接"><div class="share-actions"><button class="btn primary" data-act="nativeShare">分享链接</button><button class="btn" data-act="copyLink">复制链接</button><button class="btn" data-act="closeShare">关闭</button></div><p id="share-status" role="status"></p><p class="share-help">苹果手机：用 Safari 打开链接，在浏览器的分享菜单里选择“添加到主屏幕”。首次使用点“启用朗读”。微信内朗读不正常时，复制链接到 Safari。</p><p class="share-help">换手机或换浏览器前，请在“设置”里备份学习记录，再到新设备恢复；进度不会自动同步。</p></dialog>\n<script id="embedded-bank" type="application/json">'+bank+'</script>\n<script>\n\'use strict\';\nconst BANK = JSON.parse(document.querySelector(\'#embedded-bank\').textContent);\nconst STORE = \'low-voltage-drill.v1\';\nconst defaults = {newLimit:20, reviewLimit:30, autoRead:true, readExplanation:true, rate:.88, voice:\'\', retryMinutes:5, experience:2, listenId:1, listenGap:3, listenExplain:true, keepAwake:true, voiceMode:\'natural\'};\nconst rates = [.75,.88,1,1.15,1.3];\nconst retryOptions = [2,5,10,20,0];\nfunction settingsFor(raw){\n  const settings={...defaults,...raw};\n  if(raw?.experience!==2){\n    settings.readExplanation=true;\n    if(settings.rate===1)settings.rate=defaults.rate;\n  }\n  for(const key of [\'newLimit\',\'reviewLimit\'])if(!Number.isInteger(settings[key])||settings[key]<0||settings[key]>1307)settings[key]=defaults[key];\n  for(const key of [\'autoRead\',\'readExplanation\'])if(typeof settings[key]!==\'boolean\')settings[key]=defaults[key];\n  if(!rates.includes(settings.rate))settings.rate=defaults.rate;\n  if(!retryOptions.includes(settings.retryMinutes))settings.retryMinutes=defaults.retryMinutes;\n  if(typeof settings.voice!==\'string\')settings.voice=\'\';\n  if(!Number.isInteger(settings.listenId)||settings.listenId<1)settings.listenId=1;\n  if(![0,1,3,5,10].includes(settings.listenGap))settings.listenGap=3;\n  if(typeof settings.listenExplain!==\'boolean\')settings.listenExplain=true;\n  if(typeof settings.keepAwake!==\'boolean\')settings.keepAwake=true;\n  settings.voiceMode=settings.voiceMode===\'system\'?\'system\':\'natural\';\n  settings.experience=2;\n  return settings;\n}\nconst intervals = [1, 3, 7, 14, 30, 60, 90];\nconst letters = \'ABCDEFGHIJKLMNOPQRSTUVWXYZ\';\nlet storageMessage = \'\';\nfunction validProgressEntry(id,p){\n  return /^\\d+$/.test(id)&&Number(id)>0&&p&&Number.isInteger(p.level)&&p.level>=-1&&p.level<7&&/^\\d{4}-\\d{2}-\\d{2}$/.test(p.due)&&/^\\d{4}-\\d{2}-\\d{2}$/.test(p.reviewed)&&typeof p.wrong===\'boolean\'&&Number.isInteger(p.cumulativeErrors)&&p.cumulativeErrors>=0&&(p.retryAt==null||Number.isFinite(p.retryAt));\n}\nfunction validDayEntry(d,c){return /^\\d{4}-\\d{2}-\\d{2}$/.test(d)&&c&&[\'fresh\',\'review\'].every(k=>Number.isInteger(c[k])&&c[k]>=0);}\nfunction loadState(){\n  try {\n    const saved = JSON.parse(localStorage.getItem(STORE));\n    if(!saved)return {settings:{...defaults},progress:{},days:{},imported:[],notes:{}};\n    const progress=Object.fromEntries(Object.entries(saved.progress||{}).filter(([id,p])=>validProgressEntry(id,p)));\n    const days=Object.fromEntries(Object.entries(saved.days||{}).filter(([d,c])=>validDayEntry(d,c)));\n    const notes=Object.fromEntries(Object.entries(saved.notes||{}).filter(([id,t])=>/^\\d+$/.test(id)&&typeof t===\'string\'&&t.length<=3000));\n    let imported=[];\n    try{imported=normalizeBank(saved.imported||[]);}catch{storageMessage=\'导入题库格式异常，已使用内置题库。可从备份恢复。\';}\n    return {settings:settingsFor(saved.settings),progress,days,imported,notes};\n  } catch {storageMessage=\'学习记录读取失败，请在设置中恢复备份。\';return {settings:{...defaults},progress:{},days:{},imported:[],notes:{}};}\n}\nlet state = loadState();\nconst app = document.querySelector(\'#app\');\nlet tab = \'daily\', selected = new Set(), active = null, result = null;\nlet bankPage = 0, query = \'\', pickId = null, dailySkipped = new Set(), wrongSeen = new Set(), utterance = null;\nlet soundReady = false, soundMessage = \'\', feedback = \'\';\nlet speechRun = 0, speechTimer = null, speechUtterances = [], lastSpeechCancelAt=-Infinity;\nlet shortRetryTimer = null;\nlet listenStatus=\'idle\', listenCursor=0, listenTimer=null;\nlet wakeHandle=null, wakeRequest=0, wakeMessage=\'\';\nconst speechSupported = \'speechSynthesis\' in window && \'SpeechSynthesisUtterance\' in window;\nconst voiceSynth = speechSupported ? window.speechSynthesis : null;\nconst pronunciation = {\n  A:\'诶\', B:\'比\', C:\'西\', D:\'迪\', E:\'伊\', F:\'艾弗\',\n  kV:\'千伏\', mV:\'毫伏\', V:\'伏\', mA:\'毫安\', kA:\'千安\', Aunit:\'安培\',\n  kW:\'千瓦\', W:\'瓦\', MΩ:\'兆欧\', kΩ:\'千欧\', Ω:\'欧姆\',\n  MHz:\'兆赫\', Hz:\'赫兹\', mm:\'毫米\', cm:\'厘米\', min:\'分钟\', \'℃\':\'摄氏度\'\n};\nconst extras = new Map(Object.entries({"2":"C。橡胶带绕在脚后跟，能限制脚跟向后滑出脚扣。A 脚掌已经位于皮带和踏板之间。B 小腿距离脚扣过远，无法固定脚跟。","3":"B。按本题采用的短时工作时间系列，第四个数是 90 min。150 min 和 120 min 都不在题干采用的这组时间里。","4":"C。题目描述的是单相线路中相线与中性线形成低阻通路。A 功率大、B 电流大都可能由正常负载或其他故障导致，单凭它们无法定义短路。","6":"B。指针表电阻挡短接表笔做欧姆调零时，指针指向最右的 0 Ω。表笔开路时指向最左的 ∞，刻度方向固定。","7":"B。同名磁极互相排斥，异名磁极才吸引。磁极间有磁力，因此也不能选无作用力。","8":"C。异步电动机常按转子绕组结构分为笼型和绕线型。星形和三角形描述三相绕组接线方式。","10":"B。冶金效应利用熔体局部材料形成较低熔点的合金，使熔体在较低温度下断开。A 和 C 是改变形状的做法，没有体现这一材料效应。","11":"C。摇表用于测量绝缘电阻，表盘常以兆欧 MΩ 为单位。1 MΩ 等于 1,000 kΩ 或 1,000,000 Ω。","15":"B。在 2.5 V 挡，量程上限 2.5 V 对应满量程。半量程或三分之二量程对应较小的电压。","17":"C。题目明确是正常通断，操作的是组合装置中的隔离开关机构。熔断体负责保护动作，断路器属于另一类开关器件。","18":"C。绝缘耐热等级 E 对应 120 ℃。105 ℃通常对应 A 级，90 ℃通常对应 Y 级。","20":"B。《工伤保险条例》第三十五条规定，四级伤残的一次性伤残补助金为 21 个月本人工资。23 个月对应三级，18 个月不属于该条规定的一级至四级补助标准。","36":"A。题目问的是「不属于」。B 的方框内有速度标记并与触点相连，C 的圆形表示速度继电器相关部件。按原题给出的图形判定，A 是排除项。","41":"A。图 A 是本题的二极管符号，只给出两个端子。B 是有三个端子的晶体管符号。C 另有门极，为晶闸管类符号。","76":"B。电容器图形的识别点是两块平行极板。A 带有二极管图形的特征，C 的主体是矩形元件。","132":"A。按题库图形，A 带有三极联动的开关触头和串联熔断元件。B、C 的画法没有画出同样的串联熔断元件。","154":"B。按题图的理想电路，第 3 段直接连接中性线 N，第 2 段在两只灯之间。原题的「可触摸」是基于题图的判定。实际作业中，严禁靠手触碰来判断是否有电，停电作业须按规程隔离并验电。","242":"A。题图 A 的矩形中有贯穿的熔体线，为熔断器识别点。B 仅画矩形，C 有二极管的方向与挡线特征。","256":"B。B 的三极开关图形带有断路器的触点标记。A 画有串联熔断器，C 的开关图形没有 B 的触点标记。","302":"A。A 的触点旁画了按钮操作机构。B 没有画出这一操作机构，C 的操作符号与 A 不同。","321":"A。按题图，L0 串入回路作为限流灯。接通相应支路时 L0、L1 同时暗红，符合两灯串联后的表现。若 L1 灯头短路，L1 不会发光。仅凭两灯暗红也不能得出支路漏电。","451":"B。首先看触点在未动作时是开的，所以排除动断触点 C。再看图中延时符号的动作方向，延时发生在断开阶段，排除延时闭合的 A。","463":"A。A 组合画出了接触器的线圈和联动的多极主触点。B、C 采用了不同的电气符号组合。","744":"A。图形画出由虚线表示的同一按钮联动机构，连接一对常开和一对常闭触点，这是复合按钮的识别要点。","1220":"A。图中两条极板线表示电容，另标有正极。带极性标记是题图识别电解电容器的线索。","1307":"B。单相异步电动机使用单相交流电源。题干后半句的功率描述不改变前半句的电源类型错误。","5":"题库选 A。这里考的是电缆短路保护条件下，熔体额定电流和电缆允许载流量之间的关系。B 把穿管绝缘导线的倍数写成了 3 倍。C 没有说明敷设方式，不能把 2.5 倍推广到所有绝缘导线。工程选型还要校验线路末端短路电流及电缆的热稳定条件。","9":"题库选 A。这道老型号题抓两个信息。第一，型号末尾的 D 对应断相保护，先排除 C。第二，题给电机功率较小，在两个带 D 的选项中选较小规格。实际整定应看电机铭牌额定电流、制造商数据和现场条件。","12":"题库选 B。题干按每千伏工作电压给出了一个最低绝缘电阻的判断口径，所以应选大于或等于 1 兆欧。另两项都不符合这道题采用的下限。现场验收须以设备资料和适用试验标准为准。","13":"题库选 A。这里问的是投运前的三相容量平衡，比较各相容量的偏差。题库采用 5% 这一口径，10% 和 3% 都与题库设定不同。不同设备和标准的适用条件、偏差基准可能不同。","14":"选 A。熔体靠电流的热效应升温，达到熔点才会熔化。同等条件下，熔体的熔点会影响达到熔化所需的时间。B 的电源电压没有直接给出熔体电流。C 把题目要判断的时间本身又拿来作条件。","16":"选 C。铅、锌一类材料的导电性能通常低于铜、银，因此同等额定电流下熔体往往做得更粗。B 说导电性好，与这道比较题相反。A 说的灭弧主要依赖器件结构和灭弧措施。","19":"选 B。判断本罪主体，先看是否负有事故报告职责。仅是员工或目击者，没有当然的资格。C 说的是一个部门，题干所问的是负有报告职责的人员。依据《刑法》第一百三十九条之一及相关司法解释。","21":"选 B。遮拦通过隔开带电部分，防止人误碰或过于接近，在题目的分类里属于一般防护安全用具。A 和 C 所说的基本或绝缘安全用具，考查的是工器具的绝缘功能。","22":"按题库选 A。两种情况都可能适用工伤待遇，但法律上的说法有区别。符合题干条件的上下班途中事故属于认定工伤，符合规定的军人旧伤复发属于视同工伤。题干把两者统称为认定，记忆时区分《工伤保险条例》第十四条和第十五条。","23":"按本题的普通隔离开关理解，选 C。它的主要用途是隔离电源，不能由题干推定它具备有载或过载分断能力。现场应看产品类别和标明的使用条件。","24":"选 A。题干说的是传统指针式万用表。整流器把交流转换成可由磁电式表头测量的电流。电磁式和电动式属于不同的表头原理。","25":"选 B。尖嘴钳上的 150 毫米是工具公称总长度。钳口开度会随操作变化，手柄也只是工具的一部分。","26":"题库选 C。面对单相两孔插座，题目采用左零、右相的接线识别规则。A 把两侧对调了，两孔插座也没有 B 所说的中间孔。","27":"题库选 C。它把额定工作电流的选型条件与产品规定的基准环境条件作了区分。实际环境温度偏离制造商规定条件时可能需要降额，不能把题库答案理解成温度永远没有影响。","28":"选 A。传统白炽灯的灯丝近似纯电阻负载，电压和电流基本同相。节能灯和日光灯的电路可能含有镇流或电子驱动，未补偿时功率因数通常低于白炽灯。","29":"选 A。《安全生产法》第一条抓的是生产安全事故这一类。B 只列举部分事故，C 又把范围缩小到特别严重的事故，都比法律规定的范围窄。","30":"选 A。《安全生产法》第二十二条的三个关键词是责任人员、责任范围、考核标准。工作时间、工资福利和晋升分别关乎其他管理事项。","31":"题库选 B。绝缘手套、绝缘靴在此题的教材分类里属于辅助安全用具。绝缘棒和绝缘夹钳属于基本绝缘安全用具，接地线和遮拦属于一般防护用具。具体作业仍要按设备电压和规程配备。","32":"选 B。普通白炽灯靠钨丝加热到高温发光。钨的熔点高，适合做这种灯丝。铅丝和铜丝都不是题目描述的发光灯丝。","33":"选 A。在电源频率不变时，旋转磁场的转速与磁极对数成反比。磁极对数翻倍，转速就减半。频率不变是这里默认的条件。","34":"选 B。按防电击保护类别，手持电动工具分Ⅰ类、Ⅱ类和Ⅲ类。抓住三个名称即可排除两类和四类。","35":"选 C。电气箱、控制柜外壳或壁龛用物理隔离来减少接近带电部分的机会，专门术语是屏护。A 的防护装置说法较宽，B 的接地保护是另一个措施。","37":"选 C。带电体周围存在电场，另一带电体进入其中会受到电场力。电压描述两点的电势差，磁场不是这道静电作用题的原因。","39":"选 C。按这道题的简化电路，人体与保护接地装置都从带电外壳通向地，形成两条并联的电流路径。串联必须是在同一条通路上依次流过两者。","40":"选 B。《工伤保险条例》第三十三条规定，停工留薪期间的原工资福利待遇由所在单位按月支付。工伤保险基金承担的是依法规定的其他工伤待遇，劳动保障部门负责行政管理。","42":"选 A。《安全生产法》第七条明确把组织职工参与民主管理和民主监督、维护职工权益的职责赋予工会。职工代表大会和董事会都不是本条指定答项。","43":"选 A。接触器用于频繁接通或断开负荷电路。短路保护通常由熔断器或断路器承担，过载保护通常由热继电器或相应保护装置承担。","44":"选 B。按理想交流电容器理解，它在电场中储能，再把能量送回电源，所以对应无功功率。视在功率是交流系统综合表示，有功功率对应平均能量消耗。","45":"题库选 A。螺口灯座的外圈接中性线，中心触点接经开关控制的相线，以减少接触外圈带来的风险。保护地线不是灯的工作回路导线。","46":"选 B。通常在其他条件相同的情况下，工作电压越高，对电气间隙的要求越大。同样间距或更小间距都不能反映这一趋势。实际间隙取值须查适用标准。","47":"题库选 A。这道题采用常见低压并联补偿电容器组的三角形接法。矩形不是三相绕组的常用接线名称，星形接法在一些设备中也存在，现场应按设计和铭牌接线。","48":"选 C。磁力线在磁体外由北极到南极，在内部从南极回到北极，形成闭合曲线。题目问的是内部，A 描述的是外部方向，B 又把磁力线误解为发散到无穷远。","50":"选 A。题里的三相电动机额定电压指施加在电机接线端的线电压。相电压是单相绕组两端电压，在星形接线时两者不同。C 只是重复了要定义的词。"}).map(([k,v])=>[Number(k),v]));\nlet questions = [], byId = new Map();\nfunction index(){\n  byId = new Map(BANK.questions.map(q=>[q.id,q]));\n  for(const q of state.imported) byId.set(q.id,q);\n  questions = [...byId.values()].sort((a,b)=>a.id-b.id);\n}\nindex();\nfunction escapeHtml(s){\n  return String(s ?? \'\').replace(/[&<>"\']/g,c=>({\'&\':\'&amp;\',\'<\':\'&lt;\',\'>\':\'&gt;\',\'"\':\'&quot;\',"\'":\'&#39;\'}[c]));\n}\nfunction day(offset=0){\n  const d = new Date();\n  d.setDate(d.getDate()+offset);\n  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,\'0\'),String(d.getDate()).padStart(2,\'0\')].join(\'-\');\n}\nfunction todayCounts(){return state.days[day()]||{fresh:0,review:0};}\nfunction save(){\n  try{localStorage.setItem(STORE,JSON.stringify(state));storageMessage=\'\';}\n  catch{storageMessage=\'浏览器未保存本次修改。请在设置里备份学习记录。\';}\n}\nfunction canPractice(q){return q.options.length>0 && q.answer.length>0 && (!q.needsImage || q.image || q.optionImages?.length===q.options.length);}\nfunction due(q){return state.progress[q.id] && state.progress[q.id].due<=day();}\nfunction readyQuestions(){return questions.filter(canPractice);}\nfunction dueQuestions(){return readyQuestions().filter(due).sort((a,b)=>state.progress[a.id].due.localeCompare(state.progress[b.id].due)||Number(state.progress[b.id].wrong)-Number(state.progress[a.id].wrong)||a.id-b.id);}\nfunction pendingRetries(){\n  return readyQuestions().filter(q=>{\n    const p=state.progress[q.id];\n    return p?.wrong && Number.isFinite(p.retryAt) && p.reviewed===day() && !dailySkipped.has(q.id);\n  }).sort((a,b)=>state.progress[a.id].retryAt-state.progress[b.id].retryAt||a.id-b.id);\n}\nfunction nextQuestion(){\n  if(tab===\'bank\')return byId.get(pickId)||null;\n  if(tab===\'wrong\')return readyQuestions().find(q=>state.progress[q.id]?.wrong && !wrongSeen.has(q.id))||null;\n  if(tab!==\'daily\')return null;\n  const c=todayCounts();\n  const retry=pendingRetries().find(q=>state.progress[q.id].retryAt<=Date.now());\n  if(retry)return retry;\n  if(c.review<state.settings.reviewLimit){\n    const q=dueQuestions().find(q=>!dailySkipped.has(q.id) && state.progress[q.id].reviewed!==day());\n    if(q)return q;\n  }\n  return c.fresh<state.settings.newLimit ? readyQuestions().find(q=>!state.progress[q.id]&&!dailySkipped.has(q.id))||null : null;\n}\nfunction updateWaiting(){\n  window.clearTimeout(shortRetryTimer);\n  shortRetryTimer=null;\n  if(tab!==\'daily\'||active)return;\n  const next=pendingRetries()[0];\n  if(!next)return;\n  const remaining=state.progress[next.id].retryAt-Date.now();\n  const target=document.querySelector(\'#retry-wait\');\n  const go=document.querySelector(\'[data-act="dueRetry"]\');\n  if(target)target.textContent=remaining<=0?\'有错题可以重做了。\':\'最早一题约 \'+Math.ceil(remaining/60000)+\' 分钟后可以重做。\';\n  if(go)go.disabled=remaining>0;\n  if(remaining>0)shortRetryTimer=window.setTimeout(updateWaiting,Math.min(15000,remaining));\n}\nfunction chooseQuestion(replay=true){\n  active=nextQuestion();\n  selected=new Set();\n  result=null;\n  soundMessage=\'\';\n  stopSpeech();\n  render();\n  if(replay&&active&&state.settings.autoRead&&soundReady)readQuestion();\n}\nfunction stopSpeech(){\n  speechRun++;\n  stopRecording();\n  window.clearTimeout(speechTimer);\n  const hadQueue=speechUtterances.length>0;\n  utterance=null;speechUtterances=[];\n  if(voiceSynth&&(hadQueue||voiceSynth.pending||voiceSynth.paused)){lastSpeechCancelAt=Date.now();voiceSynth.cancel();}\n}\nfunction chineseVoices(){\n  return (voiceSynth?.getVoices()||[]).filter(v=>/^(zh|cmn)(?:[-_]|$)/i.test(v.lang));\n}\nfunction voiceRank(v){\n  const name=v.name;\n  const highQuality=/natural|neural|premium|enhanced|自然|增强|优质/i.test(name);\n  const mandarin=/^(?:zh[-_]cn|zh[-_]hans|cmn)(?:[-_]|$)/i.test(v.lang);\n  return Number(mandarin)*1000+Number(highQuality)*90+Number(!!v.localService)*3+Number(!!v.default);\n}\nfunction speakingText(text){\n  return text.replace(/<br\\s*\\/?\\s*>/gi,\'，\').replace(/<[^>]*>/g,\'\')\n    .replace(/[（(]\\s*[）)]|[＿_]{2,}/g,\'，空白处，\')\n    .replace(/(\\d+)\\s*\\/\\s*(\\d+)/g,\'$2分之$1\')\n    .replace(/(\\d+(?:\\.\\d+)?)\\s*%/g,\'百分之$1\')\n    .replace(/(\\d+(?:\\.\\d+)?)\\s*(MΩ|kΩ|Ω|MHz|Hz|kV|mV|kA|mA|kW|V|W|A|mm|cm|min|℃)(?![A-Za-z])/g,(_,n,u)=>n+(u===\'A\'?pronunciation.Aunit:pronunciation[u]))\n    .replace(/(^|[。！？；\\n])\\s*([A-F])[.．、](?=\\s*\\D)/g,(_,p,l)=>p+pronunciation[l]+\'项，\')\n    .replace(/[\\r\\n]+/g,\'。\').replace(/，{2,}/g,\'，\').trim();\n}\nfunction lectureLines(text){\n  return (text.match(/[^。！？；]+[。！？；]?/g)||[text]).map(s=>s.trim()).filter(Boolean);\n}\nfunction selectedVoice(){\n  const voices=chineseVoices();\n  return voices.find(v=>v.voiceURI===state.settings.voice)||voices.sort((a,b)=>voiceRank(b)-voiceRank(a))[0];\n}\nfunction voiceDescription(){\n  if(!speechSupported)return \'这个浏览器暂不支持朗读。\';\n  const voice=selectedVoice();\n  if(!voice)return \'中文音色尚未就绪，朗读时将尝试系统默认普通话。可刷新音色列表或用 Safari 打开。\';\n  const natural=/natural|neural|online/i.test(voice.name);\n  const changed=state.settings.voice&&voice.voiceURI!==state.settings.voice;\n  return (changed?\'原音色在此设备不可用，已改用：\':\'本机当前音色：\')+voice.name+\'（\'+voice.lang+\'）。\'+(natural?\' 这是真人级自然音色。\':\' 这是系统机械音，想听真人级请用 Edge 浏览器打开。\');\n}\nfunction speechChunks(text,max=180){\n  const chunks=[];let current=\'\';\n  const sentences=text.match(/[^。！？；\\n]+[。！？；\\n]*|[。！？；\\n]+/g)||[];\n  for(let sentence of sentences){\n    if(current.length+sentence.length>max&&current){chunks.push(current);current=\'\';}\n    while(sentence.length>max){chunks.push(sentence.slice(0,max));sentence=sentence.slice(max);}\n    current+=sentence;\n  }\n  if(current)chunks.push(current);\n  return chunks;\n}\nfunction speech(parts, hooks={}){\n  stopSpeech();\n  if(!voiceSynth){announceSpeech(\'当前浏览器不支持朗读，请用 Safari、Edge 或 Chrome 打开。\');hooks.onError?.();return;}\n  const run=speechRun, voice=selectedVoice(), rate=state.settings.rate;\n  // A normal question (including all options, answer and explanation) is one\n  // utterance. Only unusually long imported notes need sequential units.\n  const text=parts.map(p=>speakingText(p.text)).filter(Boolean).join(\'。\').replace(/。{2,}/g,\'。\');\n  const segments=speechChunks(text,1200);\n  if(!segments.length){hooks.onEnd?.();return;}\n  let attempt=0, generation=0;\n  function fail(message){\n    if(run!==speechRun)return;\n    stopSpeech();announceSpeech(message);hooks.onError?.();\n  }\n  function play(index){\n    if(run!==speechRun)return;\n    const gen=++generation;\n    const u=new SpeechSynthesisUtterance(segments[index]);\n    let ended=false,started=false,startTime=Date.now(),idleAt=null;\n    if(voice)u.voice=voice;\n    u.lang=voice?.lang||\'zh-CN\';u.rate=rate;u.pitch=1;\n    const valid=()=>run===speechRun&&generation===gen&&!ended;\n    const recover=reason=>{\n      if(!valid())return;\n      ended=true;++generation;window.clearTimeout(speechTimer);\n      if(attempt>=1){fail(reason+\' 请点“继续听题”或“重听本题”恢复。\');return;}\n      attempt++;voiceSynth.cancel();lastSpeechCancelAt=Date.now();\n      announceSpeech(\'播放衔接中断，正在自动恢复本题（1 / 1）…\');\n      speechTimer=window.setTimeout(()=>play(index),300);\n    };\n    const monitor=()=>{\n      if(!valid())return;\n      const now=Date.now();\n      if(voiceSynth.paused)voiceSynth.resume?.();\n      if(!voiceSynth.speaking&&!voiceSynth.pending){\n        if(idleAt===null)idleAt=now;\n        if(now-idleAt>=2500){recover(\'语音没有继续播放。\');return;}\n      }else idleAt=null;\n      const maxDuration=started?Math.max(30000,u.text.length*650/rate+20000):12000;\n      if(now-startTime>maxDuration){recover(\'本题朗读没有正常结束。\');return;}\n      speechTimer=window.setTimeout(monitor,1000);\n    };\n    u.onstart=()=>{\n      if(!valid())return;\n      started=true;startTime=Date.now();hooks.onPart?.(0);\n      announceSpeech(\'正在连续朗读题目、选项和答案\'+(segments.length>1?\' · 第 \'+(index+1)+\' / \'+segments.length+\' 段\':\'\'));\n    };\n    u.onend=()=>{\n      if(!valid())return;\n      ended=true;window.clearTimeout(speechTimer);utterance=null;speechUtterances=[];\n      if(index+1<segments.length){play(index+1);return;}\n      announceSpeech(\'全部朗读完成\');hooks.onEnd?.();\n    };\n    u.onerror=event=>{\n      if(!valid())return;\n      if(event.error===\'not-allowed\'){fail(\'浏览器要求手动启动声音，请点“继续听题”或朗读按钮。\');return;}\n      recover(\'语音播放中断。\');\n    };\n    utterance=u;speechUtterances=[u];\n    announceSpeech(attempt?\'正在重新播放本题…\':\'正在启动整题连续朗读…\');\n    speechTimer=window.setTimeout(monitor,1000);\n    try{voiceSynth.speak(u);}catch{recover(\'无法启动语音。\');}\n  }\n  // Do not let an asynchronous cancel from the previous question clear new speech.\n  const settling=lastSpeechCancelAt+200-Date.now();\n  if(settling>0)speechTimer=window.setTimeout(()=>play(0),settling);\n  else play(0);\n}\nfunction announceSpeech(text){\n  soundMessage=text;\n  const target=document.querySelector(\'#speech-status\');\n  if(target)target.textContent=text;\n}\n// Recordings are only used for the embedded bank. Imported edits use their actual text.\nconst recordedThrough = 1307;\nconst recordingBase = \'./voice-v1/\';\nconst recordedPlayer = typeof Audio === \'function\' ? new Audio() : null;\nlet recordingCancel = null;\n\nfunction stopRecording(){\n  if(recordingCancel){recordingCancel();recordingCancel=null;}\n}\n\nfunction narration(q){\n  const parts = [\'第 \'+q.id+\' 题。\',q.stem];\n  if(q.type.includes(\'判断\')){\n    parts.push(\'请判断这句话对不对。\');\n  }else{\n    q.options.forEach((value,i)=>{\n      const letter=letters[i];\n      const option=q.optionImages?.[i]||!value||value===letter||value===\'选项\'+letter?\'请看图形\':value;\n      parts.push(\'选项 \'+letter+\'，\'+option+\'。\');\n    });\n  }\n  if(q.needsImage)parts.push(\'这道题要结合屏幕上的图。\');\n  const answer=q.answer.map(i=>q.type.includes(\'判断\')?q.options[i]:\n    \'选 \'+letters[i]+\'，\'+(q.optionImages?.[i]?\'对应的图形\':q.options[i])).join(\'。\');\n  const note=explanation(q);\n  return {\n    stem:speakingText(\'第 \'+q.id+\' 题。\'+q.stem+(q.needsImage?\'。请看屏幕上的图。\':\'\')).replace(/。{2,}/g,\'。\'),\n    question:speakingText(parts.join(\'。\')).replace(/。{2,}/g,\'。\'),\n    answer:speakingText(\'正确答案是，\'+answer+\'。\'),\n    detail:note?speakingText(\'来看解析。\'+note.replace(/^[A-F][。．.、]\\s*/,\'\')):\'\'\n  };\n}\n\nfunction explanation(q){return q.explanation||extras.get(q.id)||state.notes[q.id]||\'\';}\n\nfunction playNarration(q,kinds,hooks={},mode=state.settings.voiceMode){\n  const script=narration(q);\n  const tracks=kinds.filter(kind=>script[kind]);\n  const fallback=(remaining)=>speech(remaining.map(kind=>({text:script[kind]})),hooks);\n  if(mode!==\'natural\'||!recordedPlayer||q.id>recordedThrough||state.imported.includes(q)){\n    fallback(tracks);\n    return;\n  }\n  stopSpeech();\n  const run=speechRun;\n  const player=recordedPlayer;\n  let timer=null;\n  let index=0;\n  const clearTimer=()=>window.clearTimeout(timer);\n  const clearHandlers=()=>{\n    clearTimer();player.onplaying=null;player.onended=null;player.onerror=null;player.onwaiting=null;\n  };\n  recordingCancel=()=>{clearHandlers();player.pause();player.removeAttribute(\'src\');player.load();};\n  function useSystemVoice(){\n    if(run!==speechRun)return;\n    if(voiceSynth){fallback(tracks.slice(index));return;}\n    stopSpeech();announceSpeech(\'普通话音频加载失败，请点“重听本题”再试。\');hooks.onError?.();\n  }\n  function playTrack(){\n    if(run!==speechRun)return;\n    clearHandlers();\n    const kind=tracks[index];\n    if(kind===\'detail\'&&!q.explanation&&!extras.has(q.id)){useSystemVoice();return;}\n    const source=recordingBase+q.id+\'-\'+kind+\'.mp3\';\n    announceSpeech(\'正在加载自然普通话…\');\n    const watch=()=>{clearTimer();timer=window.setTimeout(useSystemVoice,12000);};\n    player.onwaiting=watch;\n    player.onerror=useSystemVoice;\n    player.onplaying=()=>{\n      if(run!==speechRun)return;\n      clearTimer();\n      announceSpeech(\'自然普通话 · \'+{stem:\'题干\',question:\'题目和选项\',answer:\'正确答案\',detail:\'解析\'}[kind]);\n    };\n    player.onended=()=>{\n      if(run!==speechRun)return;\n      clearHandlers();\n      index++;\n      if(index<tracks.length){playTrack();return;}\n      recordingCancel=null;\n      announceSpeech(\'全部朗读完成\');hooks.onEnd?.();\n    };\n    player.src=source;player.playbackRate=state.settings.rate/.88;\n    watch();\n    try{player.play()?.catch(useSystemVoice);}catch{useSystemVoice();}\n  }\n  playTrack();\n}\n\nfunction readQuestion(){\n  if(!active)return;\n  soundReady=true;\n  playNarration(active,[\'question\']);\n}\n\nfunction readResult(){\n  if(!active||!result)return;\n  soundReady=true;\n  playNarration(active,[\'answer\',\'detail\']);\n}\n\nfunction submit(){\n  if(!active||result||!selected.size||!canPractice(active))return;\n  stopSpeech();\n  const q=active;\n  const answer=[...selected].sort((a,b)=>a-b);\n  const correct=answer.length===q.answer.length&&answer.every((n,i)=>n===q.answer[i]);\n  const previous=state.progress[q.id];\n  const sameDay=previous?.reviewed===day();\n  const level=correct\n    ? Math.min(sameDay?Math.max(0,previous.level):(previous?.level??-1)+1,intervals.length-1)\n    : -1;\n  const d=day();\n  const minutes=state.settings.retryMinutes;\n  const retryAt=!correct&&minutes ? Date.now()+minutes*60000 : null;\n  const progress={level,due:day(correct?intervals[level]:1),retryAt,wrong:!correct,cumulativeErrors:(previous?.cumulativeErrors||0)+Number(!correct),reviewed:d};\n  state.progress[q.id]=progress;\n  const counts=state.days[d]||{fresh:0,review:0};\n  if(!previous)counts.fresh++;\n  else if(previous.reviewed!==d)counts.review++;\n  state.days[d]=counts;\n  save();\n  if(tab===\'wrong\')wrongSeen.add(q.id);\n  soundReady=true;\n  result={correct,due:progress.due,retryAt};\n  render();\n  document.querySelector(\'#live\').textContent=correct?\'回答正确\':\'回答错误\';\n  if(state.settings.readExplanation)readResult();\n  if(window.matchMedia(\'(max-width:650px)\').matches)document.querySelector(\'.feedback\')?.scrollIntoView({block:\'start\'});\n}\nfunction goNext(){\n  if(!active)return;\n  if(tab===\'daily\'&&!result)dailySkipped.add(active.id);\n  if(tab===\'wrong\')wrongSeen.add(active.id);\n  if(tab===\'bank\'){pickId=null;active=null;result=null;stopSpeech();render();return;}\n  chooseQuestion();\n  if(window.matchMedia(\'(max-width:650px)\').matches)document.querySelector(\'.q-head\')?.scrollIntoView({block:\'start\'});\n}\nfunction go(tabName){\n  if(tab===\'listen\')pauseListen(false);\n  tab=tabName; feedback=\'\'; pickId=null; wrongSeen=new Set(); dailySkipped=new Set();\n  soundReady=true;\n  chooseQuestion();\n}\nfunction formatDate(d){\n  if(d<=day())return \'今天\';\n  if(d===day(1))return \'明天\';\n  return d.slice(5).replace(\'-\',\'月\')+\'日\';\n}\nfunction setSelected(i){\n  if(!active||result||i<0||i>=active.options.length||!canPractice(active))return;\n  const multi=active.type.includes(\'多选\');\n  if(!multi)selected.clear();\n  if(selected.has(i))selected.delete(i);else selected.add(i);\n  render();\n  document.querySelector(\'[data-option="\'+i+\'"]\')?.focus({preventScroll:true});\n}\nconst button = (txt,act,cls=\'\',disabled=false)=>\'<button class="btn \'+cls+\'" data-act="\'+act+\'" \'+(disabled?\'disabled\':\'\')+\'>\'+txt+\'</button>\';\nfunction bar(n,max){return \'<div class="bar" aria-hidden="true"><span style="width:\'+Math.min(100,max?100*n/max:0)+\'%"></span></div>\';}\nfunction card(q){\n  const disabled=!canPractice(q);\n  const keys=q.answer.map(i=>letters[i]).join(\'、\');\n  const options=q.options.map((v,i)=>{\n    const sel=selected.has(i);\n    const str=result?(q.answer.includes(i)?\'good\':sel?\'bad\':\'\'):sel?\'selected\':\'\';\n    return \'<button type="button" class="option \'+str+\'" aria-pressed="\'+sel+\'" data-option="\'+i+\'" \'+(result||disabled?\'disabled\':\'\')+\'><b class="key">\'+letters[i]+\'</b><span>\'+escapeHtml(v)+(q.optionImages?.[i]?\'<img class="option-img" src="\'+escapeHtml(q.optionImages[i])+\'" alt="选项 \'+letters[i]+\' 的图形">\':\'\')+\'</span></button>\';\n  }).join(\'\');\n  const text=explanation(q);\n  const retryNote=result?.retryAt?\'约 \'+state.settings.retryMinutes+\' 分钟后会再出题。明天也会复习。\':\'下次复习 \'+(result?formatDate(result.due)+\' · \'+result.due:\'\');\n  const source=[20,22,40].includes(q.id)?\'<p class="small"><a href="https://xzfg.moj.gov.cn/mobile/law/detail?LawID=610" target="_blank" rel="noopener">工伤保险条例 · 国家行政法规库</a></p>\' :[29,30,42].includes(q.id)?\'<p class="small"><a href="https://qhca.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_eedeadc38d134da2b09cf51618ae2110.html" target="_blank" rel="noopener">安全生产法 · 工业和信息化部</a></p>\':q.id===19?\'<p class="small"><a href="https://www.court.gov.cn/fabu/xiangqing/16326.html" target="_blank" rel="noopener">危害生产安全刑事案件司法解释 · 最高人民法院</a></p>\':q.id===154?\'<p class="small"><a href="https://www.mem.gov.cn/gk/zfxxgkpt/fdzdgknr/202507/t20250718_551128.shtml" target="_blank" rel="noopener">低压电工作业培训大纲和考核标准 · 应急管理部</a></p>\':\'\';\n  const aiHelp=\'<p>\'+button(\'复制讲解问题\',\'aiCopy\',\'ghost\')+\' \'+button(\'粘贴解析\',\'addNote\',\'ghost\')+\' <small>从 ChatGPT 获取讲解后，可粘贴回来保存和朗读。</small></p>\';\n  const details=result?\'<div class="feedback \'+(result.correct?\'\':\'wrong\')+\'"><strong>\'+(result.correct?\'回答正确\':\'回答错误\')+\' · 正确答案 \'+keys+\'</strong><p>\'+escapeHtml(keys? q.answer.map(i=>letters[i]+\'．\'+(q.options[i]||\'图形选项\')).join(\'\u3000\'):\'\')+\'</p><p><b>\'+(q.explanation?\'原题库解析\':extras.has(q.id)?\'补充解析\':text?\'我的解析\':\'解析\')+\'</b>\u3000\'+escapeHtml(text||\'原题库暂无解析。\')+\'</p>\'+button(\'重听完整解析\',\'readResult\',\'ghost\')+(!text?aiHelp:\'\')+source+\'<p class="small">\'+retryNote+\'</p></div>\':\'\';\n  const note=q.needsImage&&!q.image&&!q.optionImages?.length?\'<p class="notice">原题含图，题图尚未导入。此题只供查看，今日练习会跳过。</p>\':\'\';\n  const img=q.image?\'<img class="qimage" src="\'+escapeHtml(q.image)+\'" alt="第 \'+q.id+\' 题原图">\':\'\';\n  const label=tab===\'daily\'?(state.progress[q.id]?.retryAt&&state.progress[q.id]?.reviewed===day()?\'错题重做\':state.progress[q.id]&&!result?\'到期复习\':\'今日练习\'):\'\';\n  return \'<article class="card"><div class="q-head"><strong>题目 \'+q.id+\' · \'+escapeHtml(q.type)+\'</strong><div class="audio-actions">\'+button(\'朗读题目\',\'read\',\'ghost\')+button(\'停止\',\'stop\')+\'</div></div><span class="audio-state muted" id="speech-status">\'+escapeHtml(soundMessage)+\'</span><h2 class="stem">\'+escapeHtml(q.stem)+\'</h2>\'+img+note+\'<div aria-label="选项">\'+options+\'</div>\'+details+\'<div class="controls"><small class="muted">\'+(result?\'\':q.type.includes(\'多选\')?\'选择所有正确选项\':label)+\'</small><div class="foot-buttons">\'+(tab===\'bank\'&&!result?button(\'返回题库\',\'next\'):tab!==\'bank\'&&!result?button(\'跳过\',\'next\'):\'\')+(result?button(tab===\'bank\'?\'回题库\':\'下一题 →\',\'next\',\'primary\'):button(\'提交答案\',\'submit\',\'primary\',!selected.size||disabled))+\'</div></div></article>\';\n}\nfunction sidebar(){\n  const c=todayCounts();\n  const groups={};\n  for(const q of readyQuestions()){\n    const p=state.progress[q.id];\n    if(p){const d=p.due<day()?day():p.due;groups[d]=(groups[d]||0)+1;}\n  }\n  const dates=Object.entries(groups).sort().slice(0,5);\n  const mastered=Object.values(state.progress).filter(p=>p.level>=3).length;\n  return \'<aside><h2 class="aside-title">今日进度</h2><div class="card"><div class="metric"><div class="stat-line"><b>新题学习</b><span class="now">\'+c.fresh+\' / \'+state.settings.newLimit+\'</span></div>\'+bar(c.fresh,state.settings.newLimit)+\'</div><div class="metric"><div class="stat-line"><b>到期复习</b><span class="now">\'+c.review+\' / \'+state.settings.reviewLimit+\'</span></div>\'+bar(c.review,state.settings.reviewLimit)+\'</div><div class="row minor"><span class="eyed">已掌握 \'+mastered+\' 题</span><span class="warn">已到期 \'+dueQuestions().length+\' 题</span></div></div><div class="card"><h2 class="aside-title">下次复习安排</h2><div class="timeline">\'+(dates.length?dates.map(([d,n])=>\'<div class="row"><span>\'+formatDate(d)+\' <small class="muted">\'+d+\'</small></span><b>\'+n+\' 题</b></div>\').join(\'\'):\'<p class="muted">完成第一道题后生成安排。</p>\')+\'</div></div></aside>\';\n}\nfunction bank(){\n  const term=query.trim();\n  const shown=questions.filter(q=>!term||(/^\\d+$/.test(term)?q.id===Number(term):q.stem.includes(term)));\n  const size=25;\n  const max=Math.max(0,Math.ceil(shown.length/size)-1);\n  bankPage=Math.min(bankPage,max);\n  return \'<div class="card"><form class="search" id="find-form"><label>题号或题干<input name="term" value="\'+escapeHtml(query)+\'" placeholder="输入题号或关键词"></label><button class="btn primary">查找</button></form><div class="list">\'+shown.slice(bankPage*size,(bankPage+1)*size).map(q=>\'<button class="btn" data-pick="\'+q.id+\'"><span>\'+q.id+\'</span>\'+escapeHtml(q.stem)+(q.needsImage?\' <span>图题</span>\':\'\')+\'</button>\').join(\'\')+\'</div>\'+(!shown.length?\'<p class="muted">没有找到符合条件的题。</p>\':\'\')+\'<div class="row">\'+button(\'上一页\',\'prevPage\',\'\',!bankPage)+\'<span class="muted">\'+(bankPage+1)+\' / \'+(max+1)+\' 页</span>\'+button(\'下一页\',\'nextPage\',\'\',bankPage>=max)+\'</div></div>\';\n}\nfunction settings(){\n  const s=state.settings;\n  const voiceOptions=chineseVoices().sort((a,b)=>voiceRank(b)-voiceRank(a)).map(v=>\'<option value="\'+escapeHtml(v.voiceURI)+\'" \'+(s.voice===v.voiceURI?\'selected\':\'\')+\'>\'+(/natural|neural|online/i.test(v.name)?\'【自然】\':\'\')+escapeHtml(v.name)+\' · \'+escapeHtml(v.lang)+\'</option>\').join(\'\');\n  const retryField=\'<label>错题重做间隔<select name="retryMinutes">\'+retryOptions.map(n=>\'<option value="\'+n+\'" \'+(n===s.retryMinutes?\'selected\':\'\')+\'>\'+(n?n+\' 分钟\':\'仅次日\')+\'</option>\').join(\'\')+\'</select></label>\';\n  const voiceField=\'<label class="voice-label">朗读方式<select name="voiceMode"><option value="natural" \'+(s.voiceMode===\'natural\'?\'selected\':\'\')+\'>自然普通话</option><option value="system" \'+(s.voiceMode===\'system\'?\'selected\':\'\')+\'>设备自带音色</option></select><small class="muted">自然普通话使用网站音频，已上线 \'+recordedThrough+\' 题。暂未提供音频或你导入的新题会使用设备声音。</small></label><label class="voice-label">设备备用音色<select name="voice"><option value="">自动优选</option>\'+voiceOptions+\'</select><small class="muted">带【自然】的是真人级神经音色（如晓晓、云希）。电脑端用 Edge 浏览器才能看到，Chrome 和手机通常只有系统机械音。试听满意后保存。</small></label>\';\n  return \'<section class="card"><h2>每日题量与朗读</h2><form id="settings-form"><div class="fields"><label>每日新题数<input type="number" min="0" max="1307" required name="newLimit" value="\'+s.newLimit+\'"></label><label>每日复习数<input type="number" min="0" max="1307" required name="reviewLimit" value="\'+s.reviewLimit+\'"></label><label class="check"><input type="checkbox" name="autoRead" \'+(s.autoRead?\'checked\':\'\')+\'>翻题自动朗读</label><label class="check"><input type="checkbox" name="readExplanation" \'+(s.readExplanation?\'checked\':\'\')+\'>提交后自动朗读解析</label><label>朗读语速<select name="rate">\'+rates.map(n=>\'<option \'+(n===s.rate?\'selected\':\'\')+\' value="\'+n+\'">\'+n+\' 倍</option>\').join(\'\')+\'</select></label>\'+retryField+voiceField+\'</div><p id="voice-description" class="notice">\'+escapeHtml(voiceDescription())+\'</p><div class="share-actions"><button class="btn primary">保存设置</button><button type="button" class="btn" data-act="tryVoice">试听音色</button><button type="button" class="btn" data-act="stop">停止</button><button type="button" class="btn" data-act="refreshVoices">刷新音色</button></div><p id="speech-status" class="muted small" role="status"></p></form></section><section class="card"><h2>题库与学习记录</h2><p class="muted">当前 \'+questions.filter(q=>explanation(q)).length+\' / \'+questions.length+\' 道题有详细解析；已有解析会完整朗读，没有解析的题会明确提示。</p><p class="notice">无需登录，记录只保存在当前浏览器。清除浏览器数据会丢失进度；换设备请先备份，再恢复。分享链接不会分享你的个人记录。</p><p class="muted">导入本程序题库 JSON，或在另一台设备恢复学习备份。相同题号的导入题目会更新其内容。</p><div class="controls">\'+button(\'导出题库 JSON\',\'exportBank\')+button(\'备份学习记录\',\'backup\')+button(\'导入题库或恢复备份\',\'import\')+\'</div><input id="import-file" type="file" accept=".json,application/json" hidden><p role="status" class="msg">\'+escapeHtml(feedback)+\'</p></section>\';\n}\n\nfunction listenQuestion(){return byId.get(state.settings.listenId)||readyQuestions()[0]||null;}\nfunction updateWakeMessage(){\n  const target=document.querySelector(\'#wake-status\');if(target)target.textContent=wakeMessage;\n}\nfunction releaseWake(){\n  wakeRequest++;\n  const old=wakeHandle;wakeHandle=null;\n  if(old)old.release().catch(()=>{});\n  wakeMessage=\'\';updateWakeMessage();\n}\nasync function requestWake(){\n  if(!state.settings.keepAwake||wakeHandle||tab!==\'listen\'||![\'playing\',\'waiting\'].includes(listenStatus))return;\n  const request=++wakeRequest;\n  if(typeof navigator===\'undefined\'||!navigator.wakeLock){wakeMessage=\'此浏览器不支持保持亮屏，请留意自动锁屏。\';updateWakeMessage();return;}\n  try{\n    const handle=await navigator.wakeLock.request(\'screen\');\n    if(request!==wakeRequest||tab!==\'listen\'||![\'playing\',\'waiting\'].includes(listenStatus)){await handle.release();return;}\n    wakeHandle=handle;wakeMessage=\'听题期间已保持屏幕亮起\';updateWakeMessage();\n    handle.addEventListener(\'release\',()=>{\n      if(wakeHandle!==handle)return;\n      wakeHandle=null;wakeMessage=\'保持亮屏已被系统关闭，请留意自动锁屏。\';updateWakeMessage();\n    });\n  }catch{if(request===wakeRequest){wakeMessage=\'暂时无法保持亮屏，请留意自动锁屏。\';updateWakeMessage();}}\n}\nfunction pauseListen(redraw=true){\n  releaseWake();\n  window.clearTimeout(listenTimer);listenTimer=null;\n  stopSpeech();\n  if([\'playing\',\'waiting\'].includes(listenStatus))listenStatus=\'paused\';\n  if(redraw&&tab===\'listen\')render();\n}\nfunction playListen(){\n  if(tab!==\'listen\')return;\n  const q=listenQuestion();if(!q)return;\n  window.clearTimeout(listenTimer);listenTimer=null;\n  if(listenCursor===1){advanceListen(1,true);return;}\n  const tracks=[\'stem\',\'answer\'];\n  listenStatus=\'playing\';soundReady=true;\n  state.settings.listenId=q.id;save();render();requestWake();\n  playNarration(q,tracks,{\n    onEnd:()=>{\n      if(tab!==\'listen\'||listenStatus!==\'playing\')return;\n      listenCursor=1;\n      const items=readyQuestions();\n      if(items.at(-1)?.id===q.id){listenStatus=\'done\';releaseWake();render();return;}\n      listenStatus=\'waiting\';render();\n      if(state.settings.listenGap===0)advanceListen(1,true);\n      else listenTimer=window.setTimeout(()=>{listenTimer=null;advanceListen(1,true);},state.settings.listenGap*1000);\n    },\n    onError:()=>{listenStatus=\'error\';releaseWake();if(tab===\'listen\')render();}\n  });\n}\nfunction advanceListen(delta,autoplay=[\'playing\',\'waiting\'].includes(listenStatus)){\n  const items=readyQuestions();\n  const current=listenQuestion();\n  const i=items.findIndex(q=>q.id===current?.id)+delta;\n  if(i<0||i>=items.length){pauseListen(false);listenStatus=i>=items.length?\'done\':\'idle\';render();return;}\n  pauseListen(false);\n  state.settings.listenId=items[i].id;listenCursor=0;listenStatus=\'idle\';save();\n  if(autoplay)playListen();else render();\n}\nfunction jumpListen(id){\n  const q=byId.get(id);\n  if(!q||!canPractice(q)){\n    document.querySelector(\'#listen-jump-status\').textContent=\'没有找到这个可听题号，请重新输入。\';return;\n  }\n  pauseListen(false);state.settings.listenId=id;listenCursor=0;listenStatus=\'idle\';save();render();\n}\nfunction listenView(){\n  const q=listenQuestion();if(!q)return \'<section class="card">没有可播放的题目。</section>\';\n  const items=readyQuestions(),pos=items.findIndex(x=>x.id===q.id);\n  const playing=[\'playing\',\'waiting\'].includes(listenStatus);\n  const labels={idle:\'准备好了，点“开始听题”即可连续播放。\',playing:\'正在听题\',waiting:state.settings.listenGap+\' 秒后自动播放下一题\',paused:\'已暂停，继续时会从本题开头重读。\',done:\'本题库已播放到最后一题。\',error:\'播放中断。请点“继续听题”重试，或到设置中更换音色。\'};\n  const note=explanation(q);\n  const controls=button(\'上一题\',\'listenPrev\',\'\',pos<=0)+(playing?button(\'暂停\',\'listenPause\',\'primary\'):button(listenStatus===\'idle\'?\'开始听题\':\'继续听题\',\'listenPlay\',\'primary\',listenStatus===\'done\'))+button(\'下一题\',\'listenNext\',\'\',pos===items.length-1)+button(\'重听本题\',\'listenReplay\',\'ghost\');\n  const options=q.options.map((v,i)=>\'<div class="listen-option"><b>\'+letters[i]+\'</b>\'+escapeHtml(v)+(q.optionImages?.[i]?\'<img class="option-img" src="\'+escapeHtml(q.optionImages[i])+\'" alt="选项 \'+letters[i]+\' 的图形">\':\'\')+\'</div>\').join(\'\');\n  return \'<div class="listen-layout"><section class="card"><p class="listen-status" role="status">\'+labels[listenStatus]+\'</p><p id="speech-status" class="muted small" role="status">\'+([\'playing\',\'error\'].includes(listenStatus)?escapeHtml(soundMessage):\'\')+\'</p><div class="listen-controls player-controls">\'+controls+\'</div><form id="listen-form" class="listen-jump"><label>从第几题开始<input name="listenStart" type="number" min="1" required step="1" value="\'+q.id+\'"></label><button class="btn">跳转</button></form><p id="listen-jump-status" role="status" class="msg"></p><div class="listen-options"><label>题间停顿 <select name="listenGap">\'+[0,1,3,5,10].map(n=>\'<option value="\'+n+\'" \'+(state.settings.lis