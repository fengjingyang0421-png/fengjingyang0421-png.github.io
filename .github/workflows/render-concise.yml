          MODEL_REPO: https://huggingface.co/hexgrad/Kokoro-82M-v1.1-zh/resolve/main
        run: |
          mkdir -p model/voices
          for file in config.json voices/zf_001.pt kokoro-v1_1-zh.pth; do
            curl -fSL --retry 3 "$MODEL_REPO/$file" -o "model/$file"
          done
          echo "b1d8410fa44dfb5c15471fd6c4225ea6b4e9ac7fa03c98e8bea47a9928476e2b  model/kokoro-v1_1-zh.pth" | sha256sum --check
      - name: Render questions and answers
        env:
          BATCH: ${{ matrix.batch }}
        run: python render-voice.py manifest.json rendered --start "$((BATCH * 82 + 1))" --end "$(((BATCH + 1) * 82))" --model-dir model --kinds stem
      - uses: actions/upload-artifact@v4
        with:
          name: mandarin-stems-${{ matrix.batch }}
          path: rendered/*.mp3
          retention-days: 1
          compression-level: 0
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: concise-narration-source
          path: voice-build
      - uses: actions/download-artifact@v4
        with:
          pattern: mandarin-stems-*
          merge-multiple: true
          path: voice-v1
      - name: Reuse practice recordings from the initial build
        env:
          ORIGINAL_BUILD_REF: refs/heads/natural-mandarin-43710668983
        run: |
          for attempt in $(seq 1 55); do
            if git ls-remote --exit-code origin "$ORIGINAL_BUILD_REF" > /dev/null; then
              git fetch --no-tags origin "$ORIGINAL_BUILD_REF"
              git archive FETCH_HEAD voice-v1 | tar -x
              break
            fi
            if [ "$attempt" = 55 ]; then
              echo 'Initial practice audio build is incomplete.' >&2
              exit 1
            fi
            sleep 30
          done
      - name: Verify audio and store a reviewable branch
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          bank=json.loads(Path('voice-build/manifest.json').read_text())
          assert len(bank)==1307
          expected={f'{q["id"]}-{k}.mp3' for q in bank for k in ('stem','question','answer','detail') if q[k]}
          present={p.name for p in Path('voice-v1').glob('*.mp3') if p.stat().st_size>400}
          assert present==expected, f'Audio incomplete: {len(expected-present)} missing'
          PYTHON
          cp voice-build/index.html index.html
          printf '%s\n' 'Voice synthesized with Kokoro-82M-v1.1-zh (Apache-2.0).' 'https://huggingface.co/hexgrad/Kokoro-82M-v1.1-zh' > voice-v1/SOURCE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html voice-v1
          git commit -m 'Add natural Mandarin with concise listening mode'
          git push origin HEAD:refs/heads/concise-mandarin-${{ github.run_id }}
