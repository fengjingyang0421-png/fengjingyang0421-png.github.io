          cat > voice-build/voice-text.cjs <<'JAVASCRIPT'
          const fs = require('node:fs');
          const vm = require('node:vm');

          const html = fs.readFileSync(process.argv[2] || 'index.html', 'utf8');
          const bank = html.match(/<script id="embedded-bank" type="application\/json">([\s\S]*?)<\/script>/)?.[1];
          const app = html.slice(html.indexOf('const BANK ='), html.lastIndexOf('</script>'));
          const element = { innerHTML: '', textContent: bank };
          const context = vm.createContext({
            document: { querySelector: () => element, querySelectorAll: () => [], addEventListener() {} },
            window: { clearTimeout() {}, addEventListener() {} },
            localStorage: { getItem: () => null },
          });
          vm.runInContext(app, context);
          const manifest = vm.runInContext(`questions.filter(canPractice).map(q => {
            const { stem, question, answer, detail } = narration(q);
            return { id: q.id, stem, question, answer, detail };
          })`, context);
          process.stdout.write(JSON.stringify(manifest));
