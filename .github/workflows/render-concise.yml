          cat > voice-build/render-voice.py <<'PYTHON'
          """Render static MP3 files for the original question bank with Kokoro Mandarin."""
          import argparse
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          os.environ.setdefault('HF_HUB_DISABLE_XET', '1')
          import numpy as np
          import torch
          from kokoro import KModel, KPipeline

          REPO = 'hexgrad/Kokoro-82M-v1.1-zh'
          SAMPLE_RATE = 24000
          VOICE = 'zf_001'


          def sentences(text):
              # Short phrases avoid speeding up or cutting off lengthy Chinese notes.
              pieces = re.findall(r'[^。！？；，]+[。！？；，]*|[。！？；，]+', text)
              buffer = ''
              for piece in pieces:
                  if buffer and len(buffer) + len(piece) > 46:
                      yield buffer
                      buffer = ''
                  while len(piece) > 55:
                      yield piece[:55]
                      piece = piece[55:]
                  buffer += piece
              if buffer:
                  yield buffer


          def render(pipeline, script, dest):
              if dest.exists():
                  return
              chunks = []
              with torch.inference_mode():
                  for sentence in sentences(script):
                      for part in pipeline(sentence, voice=VOICE, speed=0.99):
                          if part.audio is not None and len(part.audio):
                              chunks.append(part.audio.numpy())
                              chunks.append(np.zeros(int(SAMPLE_RATE * .12), np.float32))
              if not chunks:
                  raise RuntimeError(f'No audio generated for {dest.name}')
              audio = np.concatenate(chunks)
              tmp = dest.with_suffix('.tmp.mp3')
              subprocess.run(['ffmpeg','-loglevel','error','-nostdin','-y','-threads','1','-f','f32le','-ar',str(SAMPLE_RATE),'-ac','1','-i','-','-c:a','libmp3lame','-b:a','24k',str(tmp)],input=audio.astype('<f4').tobytes(),check=True)
              tmp.replace(dest)


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('manifest', type=Path)
              parser.add_argument('output', type=Path)
              parser.add_argument('--start', type=int, default=1)
              parser.add_argument('--end', type=int, default=1000000)
              parser.add_argument('--threads', type=int, default=2)
              parser.add_argument('--model-dir', type=Path)
              parser.add_argument('--kinds', nargs='+', choices=('stem','question','answer','detail'), default=('stem','question','answer','detail'))
              args = parser.parse_args()
              args.output.mkdir(parents=True, exist_ok=True)
              torch.set_num_threads(args.threads)
              torch.set_num_interop_threads(1)
              english = KPipeline(lang_code='a', repo_id=REPO, model=False)
              files = {'config': str(args.model_dir / 'config.json'), 'model': str(args.model_dir / 'kokoro-v1_1-zh.pth')} if args.model_dir else {}
              model = KModel(repo_id=REPO, **files).cpu().eval()
              pipeline = KPipeline(lang_code='z', repo_id=REPO, model=model, en_callable=lambda t: next(english(t)).phonemes, device='cpu')
              if args.model_dir:
                  pipeline.voices[VOICE] = torch.load(args.model_dir / 'voices' / f'{VOICE}.pt', weights_only=True)
              start = time.monotonic()
              for q in json.loads(args.manifest.read_text()):
                  if args.start <= q['id'] <= args.end:
                      for kind in args.kinds:
                          if q[kind]:
                              render(pipeline, q[kind], args.output / f'{q["id"]}-{kind}.mp3')
                      if q['id'] % 25 == 0 or q['id'] < 5:
                          print(f'{q["id"]}: {time.monotonic() - start:.1f}s', flush=True)


          if __name__ == '__main__':
              main()
          PYTHON
          python3 voice-build/prepare.py
