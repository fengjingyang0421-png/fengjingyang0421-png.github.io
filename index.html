stem":"电气线路故障可能导致触电、火灾、停电等多种事故。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":610,"type":"判断题","stem":"使用万用表电阻档能够精确测量变压器的线圈电阻。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":611,"type":"判断题","stem":"导体的电阻大小与温度变化无关，在不同温度时，同一导体的电阻相同。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":612,"type":"判断题","stem":"在电路中，将两个及以上的电阻的一端全部联接在一点上，而另一端全部连接在另一点上，这样的联接称为电阻的并联。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":613,"type":"判断题","stem":"生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口、疏散通道。禁止占用、锁闭、封堵生产经营场所或者员工宿舍的出口、疏散通道。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":614,"type":"判断题","stem":"在电阻串联的电路中，流过电路的总电流等于各串联电阻上电流之和。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":615,"type":"判断题","stem":"交流电动机铭牌上的频率是此电机使用的交流电源的频率。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":616,"type":"判断题","stem":"LED电光源和传统照明电光源相比，其特点为安全、节能、寿命长、显色性好和价格低廉。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":617,"type":"判断题","stem":"在生产安全事故发生后，事故现场人员李某立即打电话报告企业负责人，可电话一直打不通，于是李某就自行离开了事故现场。结果，事故抢救时机被贻误，造成了严重后果。根据刑法等有关规定，李某履行了报告职责，只是联系不上企业负责人，因此不用被追究刑事责任。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":618,"type":"判断题","stem":"保护接零适用于中性点直接接地的配电系统中。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":619,"type":"判断题","stem":"人体触电后能够自主摆脱的电流称为感知电流。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":620,"type":"判断题","stem":"低压断路器用作电源总开关时，在负荷侧应加装隔离开关，以形成明显断开点，保证检修安全。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":621,"type":"判断题","stem":"生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志。同时必须对安全设备进行经常性维护、保养，并定期检测，保证正常运转。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":622,"type":"判断题","stem":"电缆保护管的内径尺寸应等于电缆外径尺寸。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":623,"type":"判断题","stem":"依据《生产安全事故报告和调查处理条例》，事故发生后，事故现场有关人员应当立即向应急管理部门报告。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":624,"type":"判断题","stem":"建筑施工现场临时用电中照明灯具的金属外壳可不接保护零线。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":625,"type":"判断题","stem":"配电装置按电气设备安装地点不同分为户内和户外配电装置。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":626,"type":"判断题","stem":"电缆外护层代号第一个数字表示外皮层类型，第二个数字表示铠装层类型。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":627,"type":"判断题","stem":"特种作业人员应当学习和掌握相关的职业卫生知识，增强职业病防范意识。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":628,"type":"判断题","stem":"在安全事故发生后，负有报告职责的人员不报或者谎报事故情况，贻误事故抢救，情节严重的，将被处以罚款或拘留。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":629,"type":"判断题","stem":"选用低压断路器时，应考虑线路末端单相接地短路电流不小于1.25倍断路器脱扣器的整定电流。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":630,"type":"判断题","stem":"交流接触器在使用时，与熔断器、热继电器等保护电器配合使用就能具备短路保护和过载保护功能。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":631,"type":"判断题","stem":"某企业职工工作日午休时饮酒，因醉酒导致下午上班期间在车间发生事故并受到伤害，依据《工伤保险条例》，该情形不得认定为工伤。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":632,"type":"判断题","stem":"以安全电压供电的灯具称为Ⅲ类灯具。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":633,"type":"判断题","stem":"依据《安全生产法》，任何单位和个人不得阻挠和干涉对事故的依法调查处理。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":634,"type":"判断题","stem":"用万用表R×1kΩ欧姆档测量二极管时，红表笔接一只脚，黑表笔接另一只脚测得的电阻值约为几百欧姆，反向测量时电阻值很大，则该二极管是好的。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":635,"type":"判断题","stem":"刀开关在作隔离开关选用时，要求刀开关的额定电流要大于或等于线路实际的故障电流。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":636,"type":"判断题","stem":"在电气原理图中，当触点图形垂直放置时，以左开右闭原则绘制。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":637,"type":"判断题","stem":"生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":638,"type":"判断题","stem":"三相输电线比单相输电线对远距离输电意义更大。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":639,"type":"判断题","stem":"当灯具达不到最小高度时，应采用24V以下电压。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":640,"type":"判断题","stem":"尖嘴钳头部尖细，不适用于在狭小空间操作。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":641,"type":"判断题","stem":"电容器单元的短路、过电压引起的过电流，或者谐波都有导致熔断器的烧断。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":642,"type":"判断题","stem":"三相异步电动机的转子导体中会形成电流，其电流方向可用右手定则判定。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":643,"type":"判断题","stem":"对于容易产生静电的场所，应保持地面潮湿，或者铺设导电性能较好的地板。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":644,"type":"判断题","stem":"为安全起见，更换熔断器时，最好断开负载。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":645,"type":"判断题","stem":"静电现象是很普遍的电现象，其危害很大，固体静电可达200kV以上，人体静电也可达10kV以上。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":646,"type":"判断题","stem":"电动势的正方向规定为从低电位指向高电位，所以测量时电压表应正极接电源负极、而电压表负极接电源的正极。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":647,"type":"判断题","stem":"生产经营单位的特种作业人员必须按照国家有关规定经专门的安全作业培训，取得相应资格，方可上岗作业。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":648,"type":"判断题","stem":"摇表摇动后产生的电压，L端为负极，E端为正极。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":649,"type":"判断题","stem":"事故照明不允许和其他照明共用同一线路。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":650,"type":"判断题","stem":"触电者神志不清，有心跳，但呼吸停止，应立即进行口对口人工呼吸。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":651,"type":"判断题","stem":"在低压配电系统中装设剩余电流保护装置只能防止直接接触电击事故。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":652,"type":"判断题","stem":"气体放电光源是利用电流流经气体或金属蒸气时，使之产生气体放电而发光的光源。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":653,"type":"判断题","stem":"建筑施工现场临时用电中办公区、生活区、料场、宿舍需安装临时灯时，照明灯具的控制开关，应控制在相线上。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":654,"type":"判断题","stem":"速度继电器由定子、转子、触点、同步电机等部分组成。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":655,"type":"判断题","stem":"验电是保证电气作业安全的技术措施之一。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":656,"type":"判断题","stem":"安全可靠是对任何开关电器的基本要求。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":657,"type":"判断题","stem":"在TN-C、TN-C-S系统的中性线上应装设熔断器。","opt ,"错误"],"answer":[0],"explanation":""},{"id":893,"type":"判断题","stem":"对遭受或者可能遭受急性职业病危害的劳动者，用人单位应当及时组织救治、进行健康检查和医学观察，所需费用由用人单位承担。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":894,"type":"判断题","stem":"使用兆欧表测量前不必切断被测设备的电源。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":895,"type":"判断题","stem":"高压电容器外壳有异形膨胀时，一般不需要将电容器立即退出运行。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":896,"type":"判断题","stem":"依据《中华人民共和国消防法》，扰乱火灾现场秩序，或者拒不执行火灾现场指挥员指挥，影响灭火救援，情节较轻的，处警告或者五百元以下罚款。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":897,"type":"判断题","stem":"感知概率为50%时，成年男性的平均感知电流值约为1.1mA，最小为0.5mA，成年女性约为0.6mA。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":898,"type":"判断题","stem":"绝缘老化只是一种化学变化。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":899,"type":"判断题","stem":"电动机是一种将电能转化为机械能的动力设备，按电流性质可分为直流电动机和交流电动机。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":900,"type":"判断题","stem":"通电时间增加，人体电阻因出汗而增加，导致通过人体的电流减小。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":901,"type":"判断题","stem":"发生火灾时，基本的正确应变措施是:发出警报，疏散，在安全情况下设法扑救。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":902,"type":"判断题","stem":"生产经营单位未制定生产安全事故应急救援预案、未定期组织应急救援预案演练、未对从业人员进行应急教育和培训，生产经营单位的主要负责人在本单位发生生产安全事故时不立即组织抢救的，由县级以上人民政府负有安全生产监督管理职责的部门依照《中华人民共和国安全生产法》有关规定追究法律责任。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":903,"type":"判断题","stem":"电磁式继电器具有与电源同步的功能。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":904,"type":"判断题","stem":"交流接触器的额定电流，是在额定的工作条件下所决定的电流值。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":905,"type":"判断题","stem":"职工在工作时间和工作岗位，突发疾病死亡或者在72小时之内经抢救无效死亡的，视同工伤。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":906,"type":"判断题","stem":"在电压低于额定值的一定比例后能自动断电的称为欠压保护。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":907,"type":"判断题","stem":"负荷开关具有在故障情况下接通或开断短路电流的能力。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":908,"type":"判断题","stem":"自动空气开关具有过载、短路和欠电压保护。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":909,"type":"判断题","stem":"可以用相线碰地线的方法检查地线是否接地良好。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":910,"type":"判断题","stem":"HK系列隔离开关适用于工业企业配电网中不频繁操作的场所，作为电气设备及线路的过载或短路保护设备。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":911,"type":"判断题","stem":"交流接触器常见的额定最高工作电压达到6000V。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":912,"type":"判断题","stem":"使用Ⅲ类工具，必须装设额定漏电动作电流不大于30mA、动作不多于0.1s的漏电保护器。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":913,"type":"判断题","stem":"当有异物进入眼内，应及时用手揉眼，把异物揉出来。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":914,"type":"判断题","stem":"发现有人触电后，应立即通知医院派救护车来抢救，在医生来到前，现场人员不能对触电者进行抢救，以免造成二次伤害。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":915,"type":"判断题","stem":"变配电设备应有完善的屏护装置。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":916,"type":"判断题","stem":"将10A的直流电流和最大值为10A的交流电流分别通过阻值相同的电阻，则在同一时间内通过交流电流的电阻发热大。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":917,"type":"判断题","stem":"对电机各绕组的绝缘检查，如测出绝缘电阻不合格，则不允许通电运行。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":918,"type":"判断题","stem":"手持电动工具有两种分类方式，即按工作电压分类和按防潮程度分类。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":919,"type":"判断题","stem":"因工外出期间，由于工作原因受到伤害或者发生事故下落不明的，应当及时治疗及查找，但不能认定为工伤。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":920,"type":"判断题","stem":"三相交流对称电路中，如采用三角形接线时，线电流等于相电流。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":921,"type":"判断题","stem":"电气照明按照明功能分类可以分为一般照明、局部照明和混合照明。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":922,"type":"判断题","stem":"如果能够十分小心，则可以在认为安全的前提下，在具有火灾、爆炸危险的场所适当吸烟、使用明火。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":923,"type":"判断题","stem":"人员密集场所发生火灾，该场所的现场工作人员应当立即组织、引导在场人员进行灭火，控制火情，不得擅自疏散。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":924,"type":"判断题","stem":"依据《突发事件应对法》，突发事件应对工作实行预防为主、防治结合的原则。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":925,"type":"判断题","stem":"某作业人员在上岗作业期间，故意从高空坠落而自残，此时用人单位本着以人为本的理念，视同该员工为工伤。该用人单位的做法是正确的。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":926,"type":"判断题","stem":"在保证一定大小的启动转矩前提下，电动机的启动电流应尽量大。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":927,"type":"判断题","stem":"为了保证电气作业的安全性，新入厂的工作人员只有接受工厂、车间等部门的两级安全教育，才能从事电气作业。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":928,"type":"判断题","stem":"自动切换电器是依靠外力(如人力)操作，完成电路的接通或分断等操作，如接触器、继电器等。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":929,"type":"判断题","stem":"在电阻并联的电路中，电路的电流等于各分支电流之和。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":930,"type":"判断题","stem":"按照发生电击时电气设备的状态，触电分为直接触电和间接触电。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":931,"type":"判断题","stem":"在电路中A、B两点的电压用UAB表示，则UAB=UB-UA。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":932,"type":"判断题","stem":"电容器装置与其他电器设备不同，除非有特殊情况，否则严禁在不接入主保护(不平衡保护)的情况下试合闸或运行。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":933,"type":"判断题","stem":"在狭窄场所（如锅炉、金属容器内等）使用I类工具时，必须装设漏电保护器。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":934,"type":"判断题","stem":"一般情况下，接地电网的单相触电比不接地电网的危险性小。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":935,"type":"判断题","stem":"人体触电时，人体电阻越小，流过人体的电流就越小，也就越安全。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":936,"type":"判断题","stem":"三相交流电的相序是U－V－W－U，称为正序。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":937,"type":"判断题","stem":"热继电器在对电机进行过载保护时，应具备电压值可调的能力。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":938,"type":"判断题","stem":"接闪杆可以用镀锌钢管焊成，其长度应在1m以上时，钢管直径不得小于20mm。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":939,"type":"判断题","stem":"电机在检修后，经各项检查合格，即可对电机进行空载试验和短路试验。","options":["正确","错误"],"answer":[0],"explanation":""},{"id":940,"type":"判断题","stem":"开启式负荷开关用于电动机控制电路时，其额定电流应不小于电动机额定电流。","options":["正确","错误"],"answer":[1],"explanation":""},{"id":941,"type":"判断题","stem":"常用的主令电器有按钮   return /^\d+$/.test(id)&&Number(id)>0&&p&&Number.isInteger(p.level)&&p.level>=-1&&p.level<7&&/^\d{4}-\d{2}-\d{2}$/.test(p.due)&&/^\d{4}-\d{2}-\d{2}$/.test(p.reviewed)&&typeof p.wrong==='boolean'&&Number.isInteger(p.cumulativeErrors)&&p.cumulativeErrors>=0&&(p.retryAt==null||Number.isFinite(p.retryAt));
}
function validDayEntry(d,c){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&c&&['fresh','review'].every(k=>Number.isInteger(c[k])&&c[k]>=0);}
function loadState(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if(!saved)return {settings:{...defaults},progress:{},days:{},imported:[],notes:{}};
    const progress=Object.fromEntries(Object.entries(saved.progress||{}).filter(([id,p])=>validProgressEntry(id,p)));
    const days=Object.fromEntries(Object.entries(saved.days||{}).filter(([d,c])=>validDayEntry(d,c)));
    const notes=Object.fromEntries(Object.entries(saved.notes||{}).filter(([id,t])=>/^\d+$/.test(id)&&typeof t==='string'&&t.length<=3000));
    let imported=[];
    try{imported=normalizeBank(saved.imported||[]);}catch{storageMessage='导入题库格式异常，已使用内置题库。可从备份恢复。';}
    return {settings:settingsFor(saved.settings),progress,days,imported,notes};
  } catch {storageMessage='学习记录读取失败，请在设置中恢复备份。';return {settings:{...defaults},progress:{},days:{},imported:[],notes:{}};}
}

const extras = new Map(Object.entries({"2":"C。橡胶带绕在脚后跟，能限制脚跟向后滑出脚扣。A 脚掌已经位于皮带和踏板之间。B 小腿距离脚扣过远，无法固定脚跟。","3":"B。按本题采用的短时工作时间系列，第四个数是 90 min。150 min 和 120 min 都不在题干采用的这组时间里。","4":"C。题目描述的是单相线路中相线与中性线形成低阻通路。A 功率大、B 电流大都可能由正常负载或其他故障导致，单凭它们无法定义短路。","6":"B。指针表电阻挡短接表笔做欧姆调零时，指针指向最右的 0 Ω。表笔开路时指向最左的 ∞，刻度方向固定。","7":"B。同名磁极互相排斥，异名磁极才吸引。磁极间有磁力，因此也不能选无作用力。","8":"C。异步电动机常按转子绕组结构分为笼型和绕线型。星形和三角形描述三相绕组接线方式。","10":"B。冶金效应利用熔体局部材料形成较低熔点的合金，使熔体在较低温度下断开。A 和 C 是改变形状的做法，没有体现这一材料效应。","11":"C。摇表用于测量绝缘电阻，表盘常以兆欧 MΩ 为单位。1 MΩ 等于 1,000 kΩ 或 1,000,000 Ω。","15":"B。在 2.5 V 挡，量程上限 2.5 V 对应满量程。半量程或三分之二量程对应较小的电压。","17":"C。题目明确是正常通断，操作的是组合装置中的隔离开关机构。熔断体负责保护动作，断路器属于另一类开关器件。","18":"C。绝缘耐热等级 E 对应 120 ℃。105 ℃通常对应 A 级，90 ℃通常对应 Y 级。","20":"B。《工伤保险条例》第三十五条规定，四级伤残的一次性伤残补助金为 21 个月本人工资。23 个月对应三级，18 个月不属于该条规定的一级至四级补助标准。","36":"A。题目问的是「不属于」。B 的方框内有速度标记并与触点相连，C 的圆形表示速度继电器相关部件。按原题给出的图形判定，A 是排除项。","41":"A。图 A 是本题的二极管符号，只给出两个端子。B 是有三个端子的晶体管符号。C 另有门极，为晶闸管类符号。","76":"B。电容器图形的识别点是两块平行极板。A 带有二极管图形的特征，C 的主体是矩形元件。","132":"A。按题库图形，A 带有三极联动的开关触头和串联熔断元件。B、C 的画法没有画出同样的串联熔断元件。","154":"B。按题图的理想电路，第 3 段直接连接中性线 N，第 2 段在两只灯之间。原题的「可触摸」是基于题图的判定。实际作业中，严禁靠手触碰来判断是否有电，停电作业须按规程隔离并验电。","242":"A。题图 A 的矩形中有贯穿的熔体线，为熔断器识别点。B 仅画矩形，C 有二极管的方向与挡线特征。","256":"B。B 的三极开关图形带有断路器的触点标记。A 画有串联熔断器，C 的开关图形没有 B 的触点标记。","302":"A。A 的触点旁画了按钮操作机构。B 没有画出这一操作机构，C 的操作符号与 A 不同。","321":"A。按题图，L0 串入回路作为限流灯。接通相应支路时 L0、L1 同时暗红，符合两灯串联后的表现。若 L1 灯头短路，L1 不会发光。仅凭两灯暗红也不能得出支路漏电。","451":"B。首先看触点在未动作时是开的，所以排除动断触点 C。再看图中延时符号的动作方向，延时发生在断开阶段，排除延时闭合的 A。","463":"A。A 组合画出了接触器的线圈和联动的多极主触点。B、C 采用了不同的电气符号组合。","744":"A。图形画出由虚线表示的同一按钮联动机构，连接一对常开和一对常闭触点，这是复合按钮的识别要点。","1220":"A。图中两条极板线表示电容，另标有正极。带极性标记是题图识别电解电容器的线索。","1307":"B。单相异步电动机使用单相交流电源。题干后半句的功率描述不改变前半句的电源类型错误。","5":"题库选 A。这里考的是电缆短路保护条件下，熔体额定电流和电缆允许载流量之间的关系。B 把穿管绝缘导线的倍数写成了 3 倍。C 没有说明敷设方式，不能把 2.5 倍推广到所有绝缘导线。工程选型还要校验线路末端短路电流及电缆的热稳定条件。","9":"题库选 A。这道老型号题抓两个信息。第一，型号末尾的 D 对应断相保护，先排除 C。第二，题给电机功率较小，在两个带 D 的选项中选较小规格。实际整定应看电机铭牌额定电流、制造商数据和现场条件。","12":"题库选 B。题干按每千伏工作电压给出了一个最低绝缘电阻的判断口径，所以应选大于或等于 1 兆欧。另两项都不符合这道题采用的下限。现场验收须以设备资料和适用试验标准为准。","13":"题库选 A。这里问的是投运前的三相容量平衡，比较各相容量的偏差。题库采用 5% 这一口径，10% 和 3% 都与题库设定不同。不同设备和标准的适用条件、偏差基准可能不同。","14":"选 A。熔体靠电流的热效应升温，达到熔点才会熔化。同等条件下，熔体的熔点会影响达到熔化所需的时间。B 的电源电压没有直接给出熔体电流。C 把题目要判断的时间本身又拿来作条件。","16":"选 C。铅、锌一类材料的导电性能通常低于铜、银，因此同等额定电流下熔体往往做得更粗。B 说导电性好，与这道比较题相反。A 说的灭弧主要依赖器件结构和灭弧措施。","19":"选 B。判断本罪主体，先看是否负有事故报告职责。仅是员工或目击者，没有当然的资格。C 说的是一个部门，题干所问的是负有报告职责的人员。依据《刑法》第一百三十九条之一及相关司法解释。","21":"选 B。遮拦通过隔开带电部分，防止人误碰或过于接近，在题目的分类里属于一般防护安全用具。A 和 C 所说的基本或绝缘安全用具，考查的是工器具的绝缘功能。","22":"按题库选 A。两种情况都可能适用工伤待遇，但法律上的说法有区别。符合题干条件的上下班途中事故属于认定工伤，符合规定的军人旧伤复发属于视同工伤。题干把两者统称为认定，记忆时区分《工伤保险条例》第十四条和第十五条。","23":"按本题的普通隔离开关理解，选 C。它的主要用途是隔离电源，不能由题干推定它具备有载或过载分断能力。现场应看产品类别和标明的使用条件。","24":"选 A。题干说的是传统指针式万用表。整流器把交流转换成可由磁电式表头测量的电流。电磁式和电动式属于不同的表头原理。","25":"选 B。尖嘴钳上的 150 毫米是工具公称总长度。钳口开度会随操作变化，手柄也只是工具的一部分。","26":"题库选 C。面对单相两孔插座，题目采用左零、右相的接线识别规则。A 把两侧对调了，两孔插座也没有 B 所说的中间孔。","27":"题库选 C。它把额定工作电流的选型条件与产品规定的基准环境条件作了区分。实际环境温度偏离制造商规定条件时可能需要降额，不能把题库答案理解成温度永远没有影响。","28":"选 A。传统白炽灯的灯丝近似纯电阻负载，电压和电流基本同相。节能灯和日光灯的电路可能含有镇流或电子驱动，未补偿时功率因数通常低于白炽灯。","29":"选 A。《安全生产法》第一条抓的是生产安全事故这一类。B 只列举部分事故，C 又把范围缩小到特别严重的事故，都比法律规定的范围窄。","30":"选 A。《安全生产法》第二十二条的三个关键词是责任人员、责任范围、考核标准。工作时间、工资福利和晋升分别关乎其他管理事项。","31":"题库选 B。绝缘手套、绝缘靴在此题的教材分类里属于辅助安全用具。绝缘棒和绝缘夹钳属于基本绝缘安全用具，接地线和遮拦属于一般防护用具。具体作业仍要按设备电压和规程配备。","32":"选 B。普通白炽灯靠钨丝加热到高温发光。钨的熔点高，适合做这种灯丝。铅丝和铜丝都不是题目描述的发光灯丝。","33":"选 A。在电源频率不变时，旋转磁场的转速与磁极对数成反比。磁极对数翻倍，转速就减半。频率不变是这里默认的条件。","34":"选 B。按防电击保护类别，手持电动工具分Ⅰ类、Ⅱ类和Ⅲ类。抓住三个名称即可排除两类和四类。","35":"选 C。电气箱、控制柜外壳或壁龛用物理隔离来减少接近带电部分的机会，专门术语是屏护。A 的防护装置说法较宽，B 的接地保护是另一个措施。","37":"选 C。带电体周围存在电场，另一带电体进入其中会受到电场力。电压描述两点的电势差，磁场不是这道静电作用题的原因。","39":"选 C。按这道题的简化电路，人体与保护接地装置都从带电外壳通向地，形成两条并联的电流路径。串联必须是在同一条通路上依次流过两者。","40":"选 B。《工伤保险条例》第三十三条规定，停工留薪期间的原工资福利待遇由所在单位按月支付。工伤保险基金承担的是依法规定的其他工伤待遇，劳动保障部门负责行政管理。","42":"选 A。《安全生产法》第七条明确把组织职工参与民主管理和民主监督、维护职工权益的职责赋予工会。职工代表大会和董事会都不是本条指定答项。","43":"选 A。接触器用于频繁接通或断开负荷电路。短路保护通常由熔断器或断路器承担，过载保护通常由热继电器或相应保护装置承担。","44":"选 B。按理想交流电容器理解，它在电场中储能，再把能量送回电源，所以对应无功功率。视在功率是交流系统综合表示，有功功率对应平均能量消耗。","45":"题库选 A。螺口灯座的外圈接中性线，中心触点接经开关控制的相线，以减少接触外圈带来的风险。保护地线不是灯的工作回路导线。","46":"选 B。通常在其他条件相同的情况下，工作电压越高，对电气间隙的要求越大。同样间距或更小间距都不能反映这一趋势。实际间隙取值须查适用标准。","47":"题库选 A。这道题采用常见低压并联补偿电容器组的三角形接法。矩形不是三相绕组的常用接线名称，星形接法在一些设备中也存在，现场应按设计和铭牌接线。","48":"选 C。磁力线在磁体外由北极到南极，在内部从南极回到北极，形成闭合曲线。题目问的是内部，A 描述的是外部方向，B 又把磁力线误解为发散到无穷远。","50":"选 A。题里的三相电动机额定电压指施加在电机接线端的线电压。相电压是单相绕组两端电压，在星形接线时两者不同。C 只是重复了要定义的词。"}).map(([k,v])=>[Number(k),v]));

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function day(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function todayCounts(){return state.days[day()]||{fresh:0,review:0};}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(state));storageMessage='';}
  catch{storageMessage='浏览器未保存本次修改。请在设置里备份学习记录。';}
}
function canPractice(q){return q.options.length>0 && q.answer.length>0 && (!q.needsImage || q.image || q.optionImages?.length===q.options.length);}
function due(q){return state.progress[q.id] && state.progress[q.id].due<=day();}
function readyQuestions(){return questions.filter(canPractice);}
function dueQuestions(){return readyQuestions().filter(due).sort((a,b)=>state.progress[a.id].due.localeCompare(state.progress[b.id].due)||Number(state.progress[b.id].wrong)-Number(state.progress[a.id].wrong)||a.id-b.id);}
function pendingRetries(){
  return readyQuestions().filter(q=>{
    const p=state.progress[q.id];
    return p?.wrong && Number.isFinite(p.retryAt) && p.reviewed===day() && !dailySkipped.has(q.id);
  }).sort((a,b)=>state.progress[a.id].retryAt-state.progress[b.id].retryAt||a.id-b.id);
}
function nextQuestion(){
  if(tab==='bank')return byId.get(pickId)||null;
  if(tab==='wrong')return readyQuestions().find(q=>state.progress[q.id]?.wrong && !wrongSeen.has(q.id))||null;
  if(tab!=='daily')return null;
  const c=todayCounts();
  const retry=pendingRetries().find(q=>state.progress[q.id].retryAt<=Date.now());
  if(retry)return retry;
  if(c.review<state.settings.reviewLimit){
    const q=dueQuestions().find(q=>!dailySkipped.has(q.id) && state.progress[q.id].reviewed!==day());
    if(q)return q;
  }
  return c.fresh<state.settings.newLimit ? readyQuestions().find(q=>!state.progress[q.id]&&!dailySkipped.has(q.id))||null : null;
}
function updateWaiting(){
  window.clearTimeout(shortRetryTimer);
  shortRetryTimer=null;
  if(tab!=='daily'||active)return;
  const next=pendingRetries()[0];
  if(!next)return;
  const remaining=state.progress[next.id].retryAt-Date.now();
  const target=document.querySelector('#retry-wait');
  const go=document.querySelector('[data-act="dueRetry"]');
  if(target)target.textContent=remaining<=0?'有错题可以重做了。':'最早一题约 '+Math.ceil(remaining/60000)+' 分钟后可以重做。';
  if(go)go.disabled=remaining>0;
  if(remaining>0)shortRetryTimer=window.setTimeout(updateWaiting,Math.min(15000,remaining));
}
function chooseQuestion(replay=true){
  active=nextQuestion();
  selected=new Set();

}
function stopSpeech(){
  speechRun++;
  stopRecording();
  window.clearTimeout(speechTimer);
  const hadQueue=speechUtterances.length>0;
  utterance=null;speechUtterances=[];
  if(voiceSynth&&(hadQueue||voiceSynth.pending||voiceSynth.paused)){lastSpeechCancelAt=Date.now();voiceSynth.cancel();}
}
function chineseVoices(){
  return (voiceSynth?.getVoices()||[]).filter(v=>/^(zh|cmn)(?:[-_]|$)/i.test(v.lang));
}
function voiceRank(v){
  const name=v.name;
  const highQuality=/natural|neural|premium|enhanced|自然|增强|优质/i.test(name);
  const mandarin=/^(?:zh[-_]cn|zh[-_]hans|cmn)(?:[-_]|$)/i.test(v.lang);
  return Number(mandarin)*1000+Number(highQuality)*90+Number(!!v.localService)*3+Number(!!v.default);
}
function speakingText(text){
  return text.replace(/<br\s*\/?\s*>/gi,'，').replace(/<[^>]*>/g,'')
    .replace(/[（(]\s*[）)]|[＿_]{2,}/g,'，空白处，')
    .replace(/(\d+)\s*\/\s*(\d+)/g,'$2分之$1')
    .replace(/(\d+(?:\.\d+)?)\s*%/g,'百分之$1')
    .replace(/(\d+(?:\.\d+)?)\s*(MΩ|kΩ|Ω|MHz|Hz|kV|mV|kA|mA|kW|V|W|A|mm|cm|min|℃)(?![A-Za-z])/g,(_,n,u)=>n+(u==='A'?pronunciation.Aunit:pronunciation[u]))
    .replace(/(^|[。！？；\n])\s*([A-F])[.．、](?=\s*\D)/g,(_,p,l)=>p+pronunciation[l]+'项，')
    .replace(/[\r\n]+/g,'。').replace(/，{2,}/g,'，').trim();
}
function lectureLines(text){
  return (text.match(/[^。！？；]+[。！？；]?/g)||[text]).map(s=>s.trim()).filter(Boolean);
}
function selectedVoice(){
  const voices=chineseVoices();
  return voices.find(v=>v.voiceURI===state.settings.voice)||voices.sort((a,b)=>voiceRank(b)-voiceRank(a))[0];

function speechChunks(text,max=180){
  const chunks=[];let current='';
  const sentences=text.match(/[^。！？；\n]+[。！？；\n]*|[。！？；\n]+/g)||[];
  for(let sentence of sentences){
    if(current.length+sentence.length>max&&current){chunks.push(current);current='';}
    while(sentence.length>max){chunks.push(sentence.slice(0,max));sentence=sentence.slice(max);}
    current+=sentence;
  }
  if(current)chunks.push(current);
  return chunks;
}
function speech(parts, hooks={}){
  stopSpeech();
  if(!voiceSynth){announceSpeech('当前浏览器不支持朗读，请用 Safari、Edge 或 Chrome 打开。');hooks.onError?.();return;}
  const run=speechRun, voice=selectedVoice(), rate=state.settings.rate;
  // A normal question (including all options, answer and explanation) is one
  // utterance. Only unusually long imported notes need sequential units.
  const text=parts.map(p=>speakingText(p.text)).filter(Boolean).join('。').replace(/。{2,}/g,'。');
  const segments=speechChunks(text,1200);
  if(!segments.length){hooks.onEnd?.();return;}
  let attempt=0, generation=0;
  function fail(message){
    if(run!==speechRun)return;
    stopSpeech();announceSpeech(message);hooks.onError?.();
  }
  function play(index){
    if(run!==speechRun)return;
    const gen=++generation;
    const u=new SpeechSynthesisUtterance(segments[index]);
    let ended=false,started=false,startTime=Date.now(),idleAt=null;
    if(voice)u.voice=voice;
    u.lang=voice?.lang||'zh-CN';u.rate=rate;u.pitch=1;
    const valid=()=>run===speechRun&&generation===gen&&!ended;
    const recover=reason=>{
      if(!valid())return;
      ended=true;++generation;window.clearTimeout(speechTimer);
      if(attempt>=1){fail(reason+' 请点“继续听题”或“重听本题”恢复。');return;}
      attempt++;voiceSynth.cancel();lastSpeechCancelAt=Date.now();
      announceSpeech('播放衔接中断，正在自动恢复本题（1 / 1）…');
      speechTimer=window.setTimeout(()=>play(index),300);
    };
    const monitor=()=>{
      if(!valid())return;
      const now=Date.now();
      if(voiceSynth.paused)voiceSynth.resume?.();
      if(!voiceSynth.speaking&&!voiceSynth.pending){
        if(idleAt===null)idleAt=now;
        if(now-idleAt>=2500){recover('语音没有继续播放。');return;}
      }else idleAt=null;
      const maxDuration=started?Math.max(30000,u.text.length*650/rate+20000):12000;
      if(now-startTime>maxDuration){recover('本题朗读没有正常结束。');return;}
      speechTimer=window.setTimeout(monitor,1000);
    };
    u.onstart=()=>{
      if(!valid())return;
      started=true;startTime=Date.now();hooks.onPart?.(0);
      announceSpeech('正在连续朗读题目、选项和答案'+(segments.length>1?' · 第 '+(index+1)+' / '+segments.length+' 段':''));
    };
    u.onend=()=>{
      if(!valid())return;
      ended=true;window.clearTimeout(speechTimer);utterance=null;speechUtterances=[];
      if(index+1<segments.length){play(index+1);return;}
      announceSpeech('全部朗读完成');hooks.onEnd?.();
    };
    u.onerror=event=>{
      if(!valid())return;
      if(event.error==='not-allowed'){fail('浏览器要求手动启动声音，请点“继续听题”或朗读按钮。');return;}
      recover('语音播放中断。');
    };
    utterance=u;speechUtterances=[u];
    announceSpeech(attempt?'正在重新播放本题…':'正在启动整题连续朗读…');
    speechTimer=window.setTimeout(monitor,1000);
    try{voiceSynth.speak(u);}catch{recover('无法启动语音。');}
  }
  // Do not let an asynchronous cancel from the previous question clear new speech.
  const settling=lastSpeechCancelAt+200-Date.now();
  if(settling>0)speechTimer=window.setTimeout(()=>play(0),settling);
  else play(0);
}
function announceSpeech(text){
  soundMessage=text;
  const target=document.querySelector('#speech-status');
  if(target)target.textContent=text;
}
// Recordings are only used for the embedded bank. Imported edits use their actual text.
const recordedThrough = 1307;
const recordingBase = './voice-v1/';
const recordedPlayer = typeof Audio === 'function' ? new Audio() : null;
let recordingCancel = null;

function stopRecording(){
  if(recordingCancel){recordingCancel();recordingCancel=null;}
}

function narration(q){
  const parts = ['第 '+q.id+' 题。',q.stem];
  if(q.type.includes('判断')){
    parts.push('请判断这句话对不对。');
  }else{
    q.options.forEach((value,i)=>{
      const letter=letters[i];
      const option=q.optionImages?.[i]||!value||value===letter||value==='选项'+letter?'请看图形':value;
      parts.push('选项 '+letter+'，'+option+'。');
    });
  }
  if(q.needsImage)parts.push('这道题要结合屏幕上的图。');
  const answer=q.answer.map(i=>q.type.includes('判断')?q.options[i]:
    '选 '+letters[i]+'，'+(q.optionImages?.[i]?'对应的图形':q.options[i])).join('。');
  const note=explanation(q);
  return {
    stem:speakingText('第 '+q.id+' 题。'+q.stem+(q.needsImage?'。请看屏幕上的图。':'')).replace(/。{2,}/g,'。'),
    question:speakingText(parts.join('。')).replace(/。{2,}/g,'。'),
    answer:speakingText('正确答案是，'+answer+'。'),
    detail:note?speakingText('来看解析。'+note.replace(/^[A-F][。．.、]\s*/,'')):''
  };
}

function explanation(q){return q.explanation||extras.get(q.id)||state.notes[q.id]||'';}

function playNarration(q,kinds,hooks={},mode=state.settings.voiceMode){
  const script=narration(q);
  const tracks=kinds.filter(kind=>script[kind]);
  const fallback=(remaining)=>speech(remaining.map(kind=>({text:script[kind]})),hooks);
  if(mode!=='natural'||!recordedPlayer||q.id>recordedThrough||state.imported.includes(q)){
    fallback(tracks);
    return;
  }
  stopSpeech();
  const run=speechRun;
  const player=recordedPlayer;
  let timer=null;
  let index=0;
  const clearTimer=()=>window.clearTimeout(timer);
  const clearHandlers=()=>{
    clearTimer();player.onplaying=null;player.onended=null;player.onerror=null;player.onwaiting=null;
  };
  recordingCancel=()=>{clearHandlers();player.pause();player.removeAttribute('src');player.load();};
  function useSystemVoice(){
    if(run!==speechRun)return;
    if(voiceSynth){fallback(tracks.slice(index));return;}
    stopSpeech();announceSpeech('普通话音频加载失败，请点“重听本题”再试。');hooks.onError?.();
  }
  function playTrack(){
    if(run!==speechRun)return;
    clearHandlers();
    const kind=tracks[index];
    if(kind==='detail'&&!q.explanation&&!extras.has(q.id)){useSystemVoice();return;}
    const source=recordingBase+q.id+'-'+kind+'.mp3';
    announceSpeech('正在加载自然普通话…');
    const watch=()=>{clearTimer();timer=window.setTimeout(useSystemVoice,12000);};
    player.onwaiting=watch;
    player.onerror=useSystemVoice;
    player.onplaying=()=>{
      if(run!==speechRun)return;
      clearTimer();
      announceSpeech('自然普通话 · '+{stem:'题干',question:'题目和选项',answer:'正确答案',detail:'解析'}[kind]);
    };
    player.onended=()=>{
      if(run!==speechRun)return;
      clearHandlers();
      index++;
      if(index<tracks.length){playTrack();return;}
      recordingCancel=null;
      announceSpeech('全部朗读完成');hooks.onEnd?.();
    };
    player.src=source;player.playbackRate=state.settings.rate/.88;
    watch();
    try{player.play()?.catch(useSystemVoice);}catch{useSystemVoice();}
  }
  playTrack();
}

function submit(){
  if(!active||result||!selected.size||!canPractice(active))return;
  stopSpeech();
  const q=active;
  const answer=[...selected].sort((a,b)=>a-b);
  const correct=answer.length===q.answer.length&&answer.every((n,i)=>n===q.answer[i]);
  const previous=state.progress[q.id];
  const sameDay=previous?.reviewed===day();
  const level=correct
    ? Math.min(sameDay?Math.max(0,previous.level):(previous?.level??-1)+1,intervals.length-1)
    : -1;
  const d=day();
  const minutes=state.settings.retryMinutes;
  const retryAt=!correct&&minutes ? Date.now()+minutes*60000 : null;
  const progress={level,due:day(correct?intervals[level]:1),retryAt,wrong:!correct,cumulativeErrors:(previous?.cumulativeErrors||0)+Number(!correct),reviewed:d};
  state.progress[q.id]=progress;
  const counts=state.days[d]||{fresh:0,review:0};
  if(!previous)counts.fresh++;
  else if(previous.reviewed!==d)counts.review++;
  state.days[d]=counts;
  save();
  if(tab==='wrong')wrongSeen.add(q.id);
  soundReady=true;
  result={correct,due:progress.due,retryAt};
  render();
  document.querySelector('#live').textContent=correct?'回答正确':'回答错误';
  if(state.settings.readExplanation)readResult();
  if(window.matchMedia('(max-width:650px)').matches)document.querySelector('.feedback')?.scrollIntoView({block:'start'});
}

    const handle=await navigator.wakeLock.request('screen');
    if(request!==wakeRequest||tab!=='listen'||!['playing','waiting'].includes(listenStatus)){await handle.release();return;}
    wakeHandle=handle;wakeMessage='听题期间已保持屏幕亮起';updateWakeMessage();
    handle.addEventListener('release',()=>{
      if(wakeHandle!==handle)return;
      wakeHandle=null;wakeMessage='保持亮屏已被系统关闭，请留意自动锁屏。';updateWakeMessage();
    });
  }catch{if(request===wakeRequest){wakeMessage='暂时无法保持亮屏，请留意自动锁屏。';updateWakeMessage();}}
}
function pauseListen(redraw=true){
  releaseWake();
  window.clearTimeout(listenTimer);listenTimer=null;
  stopSpeech();
  if(['playing','waiting'].includes(listenStatus))listenStatus='paused';
  if(redraw&&tab==='listen')render();
}
function playListen(){
  if(tab!=='listen')return;
  const q=listenQuestion();if(!q)return;
  window.clearTimeout(listenTimer);listenTimer=null;
  if(listenCursor===1){advanceListen(1,true);return;}
  const tracks=['stem','answer'];
  listenStatus='playing';soundReady=true;
  state.settings.listenId=q.id;save();render();requestWake();
  playNarration(q,tracks,{
    onEnd:()=>{
      if(tab!=='listen'||listenStatus!=='playing')return;
      listenCursor=1;
      const items=readyQuestions();
      if(items.at(-1)?.id===q.id){listenStatus='done';releaseWake();render();return;}
      listenStatus='waiting';render();
      if(state.settings.listenGap===0)advanceListen(1,true);
      else listenTimer=window.setTimeout(()=>{listenTimer=null;advanceListen(1,true);},state.settings.listenGap*1000);
    },
    onError:()=>{listenStatus='error';releaseWake();if(tab==='listen')render();}
  });
}
function advanceListen(delta,autoplay=['playing','waiting'].includes(listenStatus)){
  const items=readyQuestions();
  const current=listenQuestion();
  const i=items.findIndex(q=>q.id===current?.id)+delta;
  if(i<0||i>=items.length){pauseListen(false);listenStatus=i>=items.length?'done':'idle';render();return;}
  pauseListen(false);
  state.settings.listenId=items[i].id;listenCursor=0;listenStatus='idle';save();
  if(autoplay)playListen();else render();
}
function jumpListen(id){
  const q=byId.get(id);
  if(!q||!canPractice(q)){
    document.querySelector('#listen-jump-status').textContent='没有找到这个可听题号，请重新输入。';return;
  }
  pauseListen(false);state.settings.listenId=id;listenCursor=0;listenStatus='idle';save();render();
}
function listenView(){
  const q=listenQuestion();if(!q)return '<section class="card">没有可播放的题目。</section>';
  const items=readyQuestions(),pos=items.findIndex(x=>x.id===q.id);
  const playing=['playing','waiting'].includes(listenStatus);
  const labels={idle:'准备好了，点“开始听题”即可连续播放。',playing:'正在听题',waiting:state.settings.listenGap+' 秒后自动播放下一题',paused:'已暂停，继续时会从本题开头重读。',done:'本题库已播放到最后一题。',error:'播放中断。请点“继续听题”重试，或到设置中更换音色。'};
  const note=explanation(q);
  const controls=button('上一题','listenPrev','',pos<=0)+(playing?button('暂停','listenPause','primary'):button(listenStatus==='idle'?'开始听题':'继续听题','listenPlay','primary',listenStatus==='done'))+button('下一题','listenNext','',pos===items.length-1)+button('重听本题','listenReplay','ghost');
  const options=q.options.map((v,i)=>'<div class="listen-option"><b>'+letters[i]+'</b>'+escapeHtml(v)+(q.optionImages?.[i]?'<img class="option-img" src="'+escapeHtml(q.optionImages[i])+'" alt="选项 '+letters[i]+' 的图形">':'')+'</div>').join('');
  return '<div class="listen-layout"><section class="card"><p class="listen-status" role="status">'+labels[listenStatus]+'</p><p id="speech-status" class="muted small" role="status">'+(['playing','error'].includes(listenStatus)?escapeHtml(soundMessage):'')+'</p><div class="listen-controls player-controls">'+controls+'</div><form id="listen-form" class="listen-jump"><label>从第几题开始<input name="listenStart" type="number" min="1" required step="1" value="'+q.id+'"></label><button class="btn">跳转</button></form><p id="listen-jump-status" role="status" class="msg"></p><div class="listen-options"><label>题间停顿 <select name="listenGap">'+[0,1,3,5,10].map(n=>'<option value="'+n+'" '+(state.settings.listenGap===n?'selected':'')+'>'+n+' 秒</option>').join('')+'</select></label><label><input type="checkbox" name="keepAwake" ' + (state.settings.keepAwake?'checked':'') + '>听题时保持亮屏</label></div><p id="wake-status" class="muted small">'+escapeHtml(wakeMessage)+'</p><p class="muted small">本题会直接读题目并说出正确答案，不读选项和解析，读完才换题。听题位置自动保存，不改变答题成绩。主动锁屏或切到后台会暂停，回来后点继续。</p></section><article class="card"><div class="row"><strong>题目 '+q.id+' · '+escapeHtml(q.type)+'</strong><span class="muted small">'+(pos+1)+' / '+items.length+'</span></div><h2 class="stem">'+escapeHtml(q.stem)+'</h2>'+(q.image?'<img class="qimage" src="'+escapeHtml(q.image)+'" alt="第 '+q.id+' 题原图">':'')+options+'<p class="listen-answer"><b>正确答案：</b>'+escapeHtml(q.answer.map(i=>letters[i]+'．'+(q.optionImages?.[i]?'图形选项':q.options[i])).join('；'))+'</p><p class="listen-explanation">'+escapeHtml(note||'本题暂无详细解析，读完答案会继续下一题。')+'</p></article></div>';
}

function render(){
  const n=Object.keys(state.progress).length;
  document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  document.querySelector('#local').innerHTML='本地进度 <b>'+n+' / '+questions.length+' 题</b>'+bar(n,questions.length);
  const title={daily:'今日练习',wrong:'错题复习',bank:'低压电工题库',listen:'听题模式',settings:'设置'}[tab];
  const desc={listen:'只朗读题干和正确答案，读完自动听下一题。',daily:'先重做已到时间的错题，再复习和学习新题。',wrong:'这里可以随时重做尚未答对的题。',bank:'已导入 '+questions.length+' / '+BANK.total+' 道顺序练习原题。',settings:'根据自己的节奏调整每天学习的题量。'}[tab];
  const head='<div class="section-head"><h1>'+title+'</h1><p>'+desc+'</p>'+(tab==='listen'?'<span class="small muted">自然普通话音频 · 支持连续听题</span>':'')+'</div>';
  const alert=storageMessage?'<p class="notice">'+escapeHtml(storageMessage)+'</p>':'';
  const starter=tab==='daily'&&active&&state.settings.autoRead&&!soundReady?'<div class="card row"><span class="muted small">点一次启用语音，后续翻题会自动朗读题干和选项。</span>'+button('启用朗读','read','ghost')+'</div>':'';
  const waiting=tab==='daily'&&pendingRetries().length?'<section class="card empty"><h2>错题等待重做</h2><p id="retry-wait" class="muted study-clock"></p>'+button('开始重做','dueRetry','primary',true)+'</section>':'';
  const skipped=tab==='daily'&&dailySkipped.size?'<p class="muted">本轮跳过了 '+dailySkipped.size+' 道题。</p>'+button('重新练习跳过的题','restartSkipped','ghost'):'';
  const empty='<section class="card empty"><h2>'+(tab==='wrong'?'本轮错题复习完成':dailySkipped.size?'本轮练习已结束':'今天的计划已完成')+'</h2><p class="muted">'+(tab==='wrong'?'仍未答对的题会保留在错题列表。':'可以浏览题库练习，或在设置里调整每日题量。')+'</p>'+skipped+'</section>';
  if(tab==='daily'||tab==='wrong')app.innerHTML=alert+'<div class="grid"><section>'+head+starter+(active?card(active):waiting?waiting+skipped:empty)+'</section>'+sidebar()+'</div>';
  if(tab==='bank')app.innerHTML=alert+head+(active?card(active):bank());
  if(tab==='listen')app.innerHTML=alert+head+listenView();
  if(tab==='settings')app.innerHTML=alert+head+settings();
  updateWaiting();
}
function saveJson(data,name){
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function validQuestion(q){
  return q&&Number.isInteger(q.id)&&q.id>0&&typeof q.stem==='string'&&q.stem.trim()&&typeof q.type==='string'&&Array.isArray(q.options)&&q.options.length>0&&q.options.length<=26&&q.options.every(v=>typeof v==='string')&&Array.isArray(q.answer)&&q.answer.length>0&&q.answer.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length)&&(!q.image||/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(q.image));
}
function safeImage(v){return typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v);}
function normalizeBank(list){
  if(!Array.isArray(list)||!list.every(q=>validQuestion(q) && (!q.optionImages || (Array.isArray(q.optionImages)&&q.optionImages.length===q.options.length&&q.optionImages.every(safeImage)))))throw Error('题库字段不完整或格式无效');
  return list.map(q=>({...q,answer:[...new Set(q.answer)].sort((a,b)=>a-b),explanation:typeof q.explanation==='string'?q.explanation:''}));
}
function restore(obj){
  const list=normalizeBank(obj.imported);
  if(!obj.settings||!obj.progress||!obj.days)throw Error('学习备份不完整');
  const s=settingsFor(obj.settings);
  if(!['newLimit','reviewLimit'].every(k=>Number.isInteger(s[k])&&s[k]>=0&&s[k]<=1307)||typeof s.autoRead!=='boolean'||typeof s.readExplanation!=='boolean'||!rates.includes(s.rate)||!retryOptions.includes(s.retryMinutes)||typeof s.voice!=='string')throw Error('备份中的设置无效');
  const datePattern=/^\d{4}-\d{2}-\d{2}$/;
  const validProgress=Object.entries(obj.progress).every(([id,p])=>/^\d+$/.test(id)&&p&&Number.isInteger(p.level)&&p.level>=-1&&p.level<intervals.length&&datePattern.test(p.due)&&datePattern.test(p.reviewed)&&typeof p.wrong==='boolean'&&Number.isInteger(p.cumulativeErrors)&&p.cumulativeErrors>=0&&(p.retryAt==null||Number.isFinite(p.retryAt)));
  const validDays=Object.entries(obj.days).every(([d,c])=>datePattern.test(d)&&c&&['fresh','review'].every(k=>Number.isInteger(c[k])&&c[k]>=0));
  if(!validProgress||!validDays)throw Error('备份中的学习记录无效');
  if(Object.keys(state.progress).length&&!window.confirm('用备份替换当前浏览器的学习记录？'))return false;
  const notes=Object.fromEntries(Object.entries(obj.notes||{}).filter(([id,text])=>/^\d+$/.test(id)&&typeof text==='string'&&text.length<=3000));
  state={settings:s,progress:obj.progress,days:obj.days,imported:list,notes};
  return true;
}
const shareURL='https://fengjingyang0421-png.github.io/';
async function copyShareLink(){
  try{await navigator.clipboard.writeText(shareURL);document.querySelector('#share-status').textContent='链接已复制，可以粘贴到微信发送。';}
  catch{const field=document.querySelector('#share-link');field.focus();field.select();document.querySelector('#share-status').textContent='请长按上方链接，选择复制。';}
}
async function shareLink(){
  if(navigator.share){try{await navigator.share({title:'低压电工刷题',text:'1307 道题，自动朗读和错题复习，无需登录。',url:shareURL});return;}catch(e){if(e.name==='AbortError')return;}}
  await copyShareLink();
}
function refreshVoiceOptions(){
  const field=document.querySelector('select[name="voice"]');
  if(!field)return;
  const chosen=field.value;
  field.innerHTML='<option value="">自动优选</option>'+chineseVoices().sort((a,b)=>voiceRank(b)-voiceRank(a)).map(v=>'<option value="'+escapeHtml(v.voiceURI)+'">'+escapeHtml(v.name)+' · '+escapeHtml(v.lang)+'</option>').join('');
  field.value=chineseVoices().some(v=>v.voiceURI===chosen)?chosen:'';
  const description=document.querySelector('#voice-description');if(description)description.textContent=voiceDescription();
}
voiceSynth?.addEventListener?.('voiceschanged',refreshVoiceOptions);
document.addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.target;
  const data=new FormData(form);
  if(form.id==='listen-form'){jumpListen(Number(data.get('listenStart')));return;}
  if(form.id==='find-form'){query=String(data.get('term')).trim();bankPage=0;render();}
  if(form.id==='settings-form'){
    state.settings={...state.settings,newLimit:Number(data.get('newLimit')),reviewLimit:Number(data.get('reviewLimit')),autoRead:data.has('autoRead'),readExplanation:data.has('readExplanation'),rate:Number(data.get('rate')),retryMinutes:Number(data.get('retryMinutes')),voice:String(data.get('voice')||''),voiceMode:data.get('voiceMode')==='system'?'system':'natural'};
    save();feedback='设置已保存';render();
  }
});
document.addEventListener('change',async e=>{
  if(e.target.name==='keepAwake'){state.settings.keepAwake=e.target.checked;save();if(state.settings.keepAwake)requestWake();else releaseWake();return;}
  if(e.target.name==='listenGap'){
    pauseListen(false);
    state.settings.listenGap=Number(e.target.value);
    listenCursor=0;save();render();return;
  }
  if(e.target.id!=='import-file'||!e.target.files.length)return;
  try{
    const data=JSON.parse(await e.target.files[0].text());
    if(data.format==='low-voltage-progress-v1'){
      if(!restore(data))return;
      feedback='学习记录已恢复';
    }else{
      const list=normalizeBank(data.questions??data);
      state.imported=[...new Map([...state.imported,...list].map(q=>[q.id,q])).values()];
      feedback='成功导入 '+list.length+' 道题';
    }
    save();index();
  }catch(error){feedback='导入失败。'+error.message;}
  render();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab)go(b.dataset.tab);
  if('pick'in b.dataset){pickId=Number(b.dataset.pick);chooseQuestion();}
  if('option'in b.dataset){setSelected(Number(b.dataset.option));return;}
  const act=b.dataset.act;
  if(act==='share')document.querySelector('#share-dialog').showModal();
  if(act==='closeShare')document.querySelector('#share-dialog').close();
  if(act==='nativeShare')shareLink();
  if(act==='copyLink')copyShareLink();
  if(act==='listenPlay')playListen();
  if(act==='listenPause')pauseListen();
  if(act==='listenPrev')advanceListen(-1);
  if(act==='listenNext')advanceListen(1);
  if(act==='listenReplay'){pauseListen(false);listenCursor=0;playListen();}
  if(act==='restartSkipped'){dailySkipped.clear();chooseQuestion();}
  if(act==='refreshVoices'){refreshVoiceOptions();}
  if(act==='tryVoice'){
    const form=document.querySelector('#settings-form');
    const prior={...state.settings};
    state.settings.voice=form.elements.voice.value;
    state.settings.rate=Number(form.elements.rate.value);
    const q=byId.get(1);
    if(q)playNarration(q,['question'],{},form.elements.voiceMode.value);
    state.settings=prior;
  }
  if(act==='read'){readQuestion();b.closest('.row')?.classList.contains('card')&&b.closest('.row').remove();}
  if(act==='aiCopy'&&active){
    const q=active;
    const prompt=['请用中文讲解以下低压电工作业练习题。先讲正确答案的依据，再逐项说明其他选项错在哪。若涉及标准、法律或操作安全，请核对现行可靠来源，指出题库答案可能存在的问题。',q.stem,...q.options.map((v,i)=>letters[i]+'．'+(v||'见题图')),'原题库答案 '+q.answer.map(i=>letters[i]).join('、')].join('\n');
    navigator.clipboard?.writeText(prompt).then(()=>{b.textContent='已复制讲解问题';}).catch(()=>window.prompt('复制后到 ChatGPT 提问',prompt));
    if(!navigator.clipboard)window.prompt('复制后到 ChatGPT 提问',prompt);
  }
  if(act==='stop'){stopSpeech();announceSpeech('已停止朗读');}
  if(act==='readResult')readResult();
  if(act==='dueRetry'){soundReady=true;chooseQuestion();}
  if(act==='addNote'&&active&&result){
    const note=window.prompt('粘贴这道题的解析（最多 3000 字）');
    if(note?.trim()){
      state.notes[active.id]=note.trim().slice(0,3000);
      save();
      render();
      if(state.settings.readExplanation)readResult();
    }
  }
  if(act==='submit')submit();
  if(act==='next')goNext();
  if(act==='nextPage'){bankPage++;render();}
  if(act==='prevPage'){bankPage--;render();}
  if(act==='exportBank')saveJson({total:BANK.total,questions},'low-voltage-questions.json');
  if(act==='backup')saveJson({format:'low-voltage-progress-v1',...state},'low-voltage-progress.json');
  if(act==='import')document.querySelector('#import-file').click();
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('#share-dialog')?.open)return;
  if(!active||e.ctrlKey||e.altKey||e.metaKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='Enter'&&(e.target.tagName!=='BUTTON'||'option'in e.target.dataset)){e.preventDefault();if(result)goNext();else submit();}
  if(/^[1-9]$/.test(e.key))setSelected(Number(e.key)-1);
  if(e.key.toLowerCase()==='r'){if(result)readResult();else readQuestion();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(tab==='listen')pauseListen();else stopSpeech();return;}
  if(tab==='daily'&&!active)render();
});
window.addEventListener('pageshow',()=>{if(tab==='daily'&&!active)render();});
chooseQuestion(false);
</script></html>
